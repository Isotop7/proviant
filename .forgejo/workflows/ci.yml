  lint:
    #needs: check
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: github.com/golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
  sonarcloud-check:
    needs: lint
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main' || forgejo.event_name == 'pull_request'
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run SonarCloud scan
        uses: sonarsource/sonarcloud-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  compile:
    needs: lint
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main' || forgejo.event_name == 'pull_request'
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile code
        run: |
          cd ./src
          mkdir -p release
          go build -o release ./...
  docker-build-and-push:
    needs: compile
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main'
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Login to Codeberg registry
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ secrets.CODEBERG_REGISTRY_USERNAME }}
          password: ${{ secrets.CODEBERG_REGISTRY_PASSWORD }}
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_URL }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            codeberg.org/${{ forgejo.repository }}:${{ forgejo.ref_name }}
            codeberg.org/${{ forgejo.repository }}:latest
            ${{ secrets.PRIVATE_REGISTRY_IMAGE }}:${{ forgejo.ref_name }}
            ${{ secrets.PRIVATE_REGISTRY_IMAGE }}:latest
