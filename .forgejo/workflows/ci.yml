name: CI

env:
  GO_VERSION: 1.26.2
  GOLANGCI_LINT_VERSION: v2.11.4
  CODEBERG_REGISTRY: codeberg.org
  PRIVATE_REGISTRY: registry.hr94.de

on:
  push:
    branches:
      - '**'

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify modules
        run: |
          cd ./src
          go mod verify
      - name: Lint code
        uses: https://github.com/golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: src
      - name: Scan for vulnerabilities
        run: |
          cd ./src
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test code
        run: |
          cd ./src
          go test -race $(go list ./... | grep -v /vendor/)
      - name: Test code coverage
        run: |
          cd ./src
          go test -coverprofile=coverage.out ./... &&
          go mod verify
      - name: Check coverage threshold
        run: |
          cd ./src
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          if (( $(echo "$COVERAGE < 15" | bc -l) )); then
            echo "Coverage is $COVERAGE%, below minimum threshold of 15%"
            exit 1
          fi
          echo "Coverage is $COVERAGE%, above minimum threshold of 15%"
      - name: Compile code
        run: |
          cd ./src
          mkdir -p release
          go build -o release ./...
  frontend-check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint CSS
        run: npm run lint-css
      - name: Lint JS
        run: npm run lint-js
      - name: Lint HTML
        run: npm run lint-html

  docker-build-and-push:
    needs: check
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Codeberg registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CODEBERG_REGISTRY }}
          username: ${{ secrets.CODEBERG_REGISTRY_USERNAME }}
          password: ${{ secrets.CODEBERG_REGISTRY_PASSWORD }}
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.CODEBERG_REGISTRY }}/${{ forgejo.repository }}:${{ forgejo.ref_name }}
            ${{ env.CODEBERG_REGISTRY }}/${{ forgejo.repository }}:latest
            ${{ env.PRIVATE_REGISTRY }}/${{ forgejo.repository }}:${{ forgejo.ref_name }}
            ${{ env.PRIVATE_REGISTRY }}/${{ forgejo.repository }}:latest
      - name: Build and push Demo Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile.demo
          push: true
          tags: |
            ${{ env.CODEBERG_REGISTRY }}/${{ forgejo.repository }}:demo
            ${{ env.PRIVATE_REGISTRY }}/${{ forgejo.repository }}:demo
  sonarcloud-scan:
    needs: check
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main' || forgejo.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run SonarCloud scan
        continue-on-error: true
        uses: https://github.com/SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
