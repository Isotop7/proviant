name: CI

env:
  GO_VERSION: 1.25
  GOLANGCI_LINT_VERSION: v2.6.2
  FORGEJO_REGISTRY: data.forgejo.org

on: [push]

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check code format and vet
        run: |
          cd ./src
          go fmt $(go list ./... | grep -v /vendor/)
          go vet $(go list ./... | grep -v /vendor/)
      - name: Run static analysis
        run: |
          cd ./src
          go get honnef.co/go/tools/cmd/staticcheck@latest
          go run honnef.co/go/tools/cmd/staticcheck@latest -checks=all,-ST1000,-U1000 ./...
      - name: Test code
        run: |
          cd ./src
          go test -race $(go list ./... | grep -v /vendor/)
      - name: Verify modules
        run: |
          cd ./src
          go mod verify
  golangci-lint:
    needs: check
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: https://github.com/golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: src
  sonarcloud-check:
    needs: lint
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main' || forgejo.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run SonarCloud scan
        continue-on-error: true
        uses: https://github.com/SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  compile:
    needs: lint
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main' || forgejo.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile code
        run: |
          cd ./src
          mkdir -p release
          go build -o release ./...
  docker-build-and-push:
    needs: compile
    if: forgejo.ref == 'refs/heads/develop' || forgejo.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: ${{ secrets.SELF_HOSTED_DOCKER_ENDPOINT }}
      - name: Login to Codeberg registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.FORGEJO_REGISTRY }}
          username: ${{ secrets.CODEBERG_REGISTRY_USERNAME }}
          password: ${{ secrets.CODEBERG_REGISTRY_PASSWORD }}
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_URL }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            ${{ env.FORGEJO_REGISTRY }}/${{ forgejo.repository }}:${{ forgejo.ref_name }}
            ${{ env.FORGEJO_REGISTRY }}/${{ forgejo.repository }}:latest
            ${{ secrets.PRIVATE_REGISTRY_IMAGE }}:${{ forgejo.ref_name }}
            ${{ secrets.PRIVATE_REGISTRY_IMAGE }}:latest
