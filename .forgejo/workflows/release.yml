name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout main branch
        run: |
          git checkout main
          git pull origin main

      - name: Install git-cliff
        uses: https://github.com/taiki-e/install-action@git-cliff

      - name: Generate full changelog
        run: |
          git-cliff --config cliff.toml --verbose --output CHANGELOG.md

      - name: Configure git
        run: |
          git config user.name "proviant-release-bot"
          git config user.email "release-bot@isotop7.codeberg.org"

      - name: Commit CHANGELOG.md
        run: |
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ forgejo.ref_name }}"
          git push "https://${{ secrets.RELEASE_TOKEN }}@codeberg.org/${{ forgejo.repository }}.git" HEAD:main
          git fetch origin main:tmp-main
          git checkout tmp-main -- CHANGELOG.md

      - name: Create Release
        run: |
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$previous_tag" ]; then
            git-cliff --config cliff.toml --verbose "$previous_tag..HEAD" --output /tmp/release_notes.md
          else
            echo "# Release ${{ forgejo.ref_name }}" > /tmp/release_notes.md
            git-cliff --config cliff.toml --verbose --output CHANGELOG.md
            cat CHANGELOG.md >> /tmp/release_notes.md
          fi
          release_body=$(cat /tmp/release_notes.md)
          curl -X POST \
            "https://codeberg.org/api/v1/repos/${{ forgejo.repository }}/releases" \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$release_body" --arg tag "${{ forgejo.ref_name }}" \
                '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: false}')"
