<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proviant — Product Expired</title>
</head>
<body style="margin:0;padding:0;background-color:#F5FAF5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5FAF5;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#FFFFFF;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(26,48,40,0.10);">
                    <!-- Header -->
                    <tr>
                        <td style="padding:32px 32px 0 32px;text-align:center;">
                            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                                <tr>
                                    <td style="width:48px;height:48px;background-color:#DC2626;border-radius:12px;text-align:center;vertical-align:middle;">
                                        <span style="font-size:24px;line-height:48px;color:#FFFFFF;">&#9888;</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:24px 32px 32px 32px;">
                            <h1 style="margin:0 0 8px 0;font-size:24px;font-weight:700;color:#1A3028;text-align:center;">Product Expired</h1>
                            <p style="margin:0 0 24px 0;font-size:16px;line-height:1.6;color:#6A9580;text-align:center;">
                                The following product in your household has expired:
                            </p>

                            <!-- Product Details Card -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EBF5EB;border-radius:8px;border:1px solid #C8DDD0;">
                                <tr>
                                    <td style="padding:20px;">
                                        <p style="margin:0 0 12px 0;font-size:18px;font-weight:600;color:#1A3028;">{{.ProductName}}</p>
                                        <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;">
                                            <tr>
                                                <td style="padding:4px 0;font-size:14px;color:#6A9580;">
                                                    <strong style="color:#2D4F3C;">Barcode:</strong> {{.Barcode}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding:4px 0;font-size:14px;color:#6A9580;">
                                                    <strong style="color:#2D4F3C;">ID:</strong> {{.ID}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding:4px 0;font-size:14px;color:#DC2626;">
                                                    <strong style="color:#2D4F3C;">Expired:</strong> {{.ExpireAt}}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:24px 0 0 0;font-size:16px;line-height:1.6;color:#6A9580;text-align:center;">
                                Please take the necessary actions to ensure the safety and quality of your products.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:0 32px 32px 32px;border-top:1px solid #C8DDD0;">
                            <p style="margin:16px 0 0 0;font-size:14px;line-height:1.6;color:#6A9580;text-align:center;">
                                Thank you for using <strong style="color:#2D4F3C;">Proviant</strong>!
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
