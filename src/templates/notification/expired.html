<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proviant — Product Expired</title>
</head>
<body style="margin:0;padding:0;background-color:#0F172A;font-family:'DM Sans Variable',system-ui,-apple-system,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0F172A;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#1E293B;border-radius:12px;overflow:hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="padding:32px 32px 0 32px;text-align:center;">
                            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                                <tr>
                                    <td style="width:48px;height:48px;background-color:#F87171;border-radius:12px;text-align:center;vertical-align:middle;">
                                        <span style="font-size:24px;line-height:48px;color:#0F172A;">&#9888;</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:24px 32px 32px 32px;">
                            <h1 style="margin:0 0 8px 0;font-size:24px;font-weight:700;color:#F8FAFC;text-align:center;">Product Expired</h1>
                            <p style="margin:0 0 24px 0;font-size:16px;line-height:1.6;color:#94A3B8;text-align:center;">
                                The following product in your household has expired:
                            </p>

                            <!-- Product Details Card -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#334155;border-radius:8px;">
                                <tr>
                                    <td style="padding:20px;">
                                        <p style="margin:0 0 12px 0;font-size:18px;font-weight:600;color:#F8FAFC;">{{.ProductName}}</p>
                                        <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;">
                                            <tr>
                                                <td style="padding:4px 0;font-size:14px;color:#94A3B8;">
                                                    <strong style="color:#E2E8F0;">Barcode:</strong> {{.Barcode}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding:4px 0;font-size:14px;color:#94A3B8;">
                                                    <strong style="color:#E2E8F0;">ID:</strong> {{.ID}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding:4px 0;font-size:14px;color:#F87171;">
                                                    <strong style="color:#E2E8F0;">Expired:</strong> {{.ExpireAt}}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:24px 0 0 0;font-size:16px;line-height:1.6;color:#94A3B8;text-align:center;">
                                Please take the necessary actions to ensure the safety and quality of your products.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:0 32px 32px 32px;border-top:1px solid rgba(255,255,255,0.08);">
                            <p style="margin:16px 0 0 0;font-size:14px;line-height:1.6;color:#94A3B8;text-align:center;">
                                Thank you for using <strong style="color:#E2E8F0;">Proviant</strong>!
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
