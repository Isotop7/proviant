  /api/v1/products/{id}/consume:
    post:
      consumes:
      - application/json
      description: 'Consumes the requested number of packs. Omitting the body or quantity
        consumes the whole stock. A partial consume leaves the remaining packs active;
        a full consume soft-deletes the row with removal reason consumed. A cause
        in the body is ignored: a consume has no reason. The response carries the
        number of packs that actually left the stock.'
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pack quantity, optional waste cause and optional offline mutation
          ID
        in: body
        name: action
        schema:
          $ref: '#/definitions/api.ProductActionDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
