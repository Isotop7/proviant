            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Returns a single product
      tags:
      - product
    patch:
      consumes:
      - application/json
      description: Updates a product with new values. A field the request does not
        carry keeps its stored value; a pointer field sent as null is cleared. The
        pack count must be at least 1. The pack size is free text and may be set to
        an empty string to clear it. The price is the price of one pack, so the savings
        of the product are that price times the number of packs.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/database.ProductDTOPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.ProductDTOPatch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Updates a product
      tags:
      - product
    put:
      consumes:
      - application/json
      description: Replaces a product with new values. A field the request does not
        carry is cleared, so the request states the whole product. The pack count
        must be at least 1. The pack size is free text and may be set to an empty
        string to clear it. The price is the price of one pack, so the savings of
        the product are that price times the number of packs.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/database.ProductDTOPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.ProductDTOPatch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Replaces a product
      tags:
      - product
