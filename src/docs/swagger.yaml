  /api/v1/products/{id}/waste:
    post:
      consumes:
      - application/json
      description: Wastes the requested number of packs. Omitting the body or quantity
        wastes the whole stock. A partial waste leaves the remaining packs active;
        a full waste soft-deletes the row with removal reason wasted and fires the
        product.wasted webhook. The optional waste cause names why the packs were
        wasted (spoiled, overbought, forgotten, disliked, other); a waste without
        a cause is recorded as unattributed waste. The response carries the number
        of packs that actually left the stock.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pack quantity, optional waste cause and optional offline mutation
          ID
        in: body
        name: action
        schema:
          $ref: '#/definitions/api.ProductActionDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ProductActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Waste product packs
      tags:
      - product
  /api/v1/products/archived:
    get:
      description: 'Return a list of archived products of user. The response carries
        the products of the page, the total number of archived products the caller
        may see, and the window that produced the page. The total counts the whole
        archived set, not the page. The archived products are ordered by their id,
        so a client that walks the pages by offset reads every one of them exactly
        once. The endpoint pages by its own window: an ids parameter is not read here,
        the archived list is never narrowed to named products.'
      parameters:
      - default: 100
        description: Number of archived products to return (1-1000)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of archived products to skip before the first one returned
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ProductListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Return a list of archived products
      tags:
      - product
  /api/v1/products/bulk:
    post:
      consumes:
      - application/json
      description: 'Creates products from a list of drafts with per-item results.
        Partial success is allowed; each item reports created or failed with a reason.
        The price of a draft is the price of the whole line and is stored per pack,
        so a draft of three packs at 6 EUR stores a price of 2 EUR per pack. A batch
        is insert-only: a draft that duplicates a row of the household — the same
        barcode in the same storage location with the same effective expiry — is written
        as a row of its own, because a batch may hold several packs of one product
        and a duplicate cannot be answered with a question.'
      parameters:
      - description: Product drafts
        in: body
        name: items
        required: true
        schema:
          $ref: '#/definitions/api.BulkCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BulkCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Create multiple products
      tags:
      - product
  /api/v1/products/bulkConsume:
    post:
      consumes:
      - application/json
      description: 'Soft-deletes (archives) multiple products without firing product.wasted
        webhook events. Reports the ids that were not touched: 404 when none could
        be consumed (unknown or foreign ids), 200 with the failed ids in failedIds
        when only some fail, 500 (also carrying failedIds) when a failure was server-side.'
      parameters:
      - description: Product IDs
        in: body
        name: productIDs
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
      summary: Mark multiple products as consumed
      tags:
      - product
  /api/v1/products/bulkRestore:
    post:
      consumes:
      - application/json
      description: 'Restores a list of product of a user. Reports the ids that were
        not restored: 404 when none could be restored (unknown or foreign ids), 200
        with the failed ids in failedIds when only some fail, 500 (also carrying failedIds)
        when a failure was server-side.'
      parameters:
      - description: Product IDs
        in: body
        name: productIDs
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
      summary: Restores a list of product
      tags:
      - product
  /api/v1/products/bulkWaste:
    post:
      consumes:
      - application/json
      description: 'Hard-deletes multiple products and fires the product.wasted webhook
        per product. The optional waste cause names why the products were wasted (spoiled,
        overbought, forgotten, disliked, other) and applies to every product of the
        request. Reports the ids that were not touched: 404 when none could be wasted
        (unknown or foreign ids), 200 with the failed ids in failedIds when only some
        fail, 500 (also carrying failedIds) when a failure was server-side.'
      parameters:
      - description: Product IDs and the optional waste cause
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BulkProductsAPIModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.BulkActionResponse'
      summary: Mark multiple products as wasted
      tags:
      - product
