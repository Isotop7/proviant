        most over-buys and a one-sentence insight about it, and a 6-month trend.
        EUR prices come from per-product overrides (if set)
        or category averages; CO2 is sourced from the Agribalyse LCA database via
        Open Food Facts ecoscore_data.
      parameters:
      - description: 'Period window: month | 3months | 6months | 12months (default
          6months). The window is floored to the first of the month for monthly-breakdown
          contiguity.'
        in: query
        name: period
        type: string
      - description: 'Sort mostWastedCategories by: count | cost (default count)'
        in: query
        name: sort
        type: string
      - description: Max number of categories to return (default 5, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
