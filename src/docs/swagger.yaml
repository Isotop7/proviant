externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:5050
info:
  contact:
    email: hendrik@hr94.de
    name: Isotop7
    url: https://github.com/Isotop7/proviant
  description: proviant is a simple and intuitive application to track your bought
    products and their expiration date to prevent waste of food.
  license:
    name: MIT
    url: https://github.com/Isotop7/proviant/blob/main/LICENSE
  title: proviant
  version: 0.2.0
paths:
  /api/v1/admin/audit-log:
    get:
      description: Returns paginated audit log entries for the caller's household.
        Household admins only; entries are scoped to the caller's household.
      parameters:
      - description: Maximum number of logs to return (default 100, max 1000)
        in: query
        name: limit
        type: integer
      - description: Filter by date (YYYY-MM-DD format)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AuditLogResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get audit logs
      tags:
      - admin
  /api/v1/admin/users:
    get:
      description: Returns all users that belong to the household the caller is admin
        of
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.HouseholdUserResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: List household members
      tags:
      - household
  /api/v1/admin/users/{id}:
    delete:
      description: Deletes a user from the household. Caller must be admin.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Delete household member
      tags:
      - household
    patch:
      consumes:
      - application/json
      description: Updates the username or email of a user in the household. Caller
        must be admin.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/v1.updateAdminUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HouseholdUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Update household member
      tags:
      - household
  /api/v1/admin/users/{id}/reset-password:
    post:
      description: Sends a password reset email to the specified user. Caller must
        be admin.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Reset user password
      tags:
      - household
  /api/v1/admin/users/{id}/reset-two-factor:
    post:
      description: Removes the second factor and the recovery codes of a member of
        the household and sends them a password reset mail. Caller must be admin.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
