        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Consume product packs
      tags:
      - product
  /api/v1/products/{id}/consumption-rate:
    get:
      description: |-
        Returns the household's average weekly consumption for a product
        based on archived consumed samples within the last 90 days.
        Requires at least 2 samples spanning at least 7 days; otherwise
        HasEstimate is false.
