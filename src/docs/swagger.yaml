  /api/v1/shopping-list/{id}/purchase:
    post:
      consumes:
      - application/json
      description: 'Turns a shopping list item into a product of the household and
        checks the item. The pack count of the product is the number of packs bought,
        which is not the number the item asked for. The expiry is the one the request
        carries; without one the household''s shelf life of the category fills it.
        An item that already points at a product gets the bought packs added to that
        product instead of a second row — that product keeps its own expiry, category,
        pack size and storage location, so the fields of the request that describe
        a product do not apply to it. The product and the check land together or not
        at all. A bought product that matches one the household already has is refused
        with 409 and the matched product in the body: the caller decides whether the
        packs belong to that row (addToProductId) or make a product of their own (allowDuplicate).'
      parameters:
      - description: Shopping list item ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'The purchase: packs bought, expiry, category, storage location'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PurchaseShoppingListItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.PurchaseShoppingListItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ProductConflictResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Buys a shopping list item
      tags:
      - shopping-list
