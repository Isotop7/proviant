        type: integer
    type: object
  api.ExpiryScanResponse:
    properties:
      confidence:
        description: 0.0–1.0
        type: number
      detectedDate:
        description: ISO 8601 (YYYY-MM-DD) if parsed, else empty
        type: string
      language:
        description: detected language if available
        type: string
      rawText:
        description: full OCR text for manual correction
        type: string
    type: object
  api.ExportProductResponse:
    properties:
      amount:
        description: |-
          Amount and Unit carry the shape of a document written before products
          were counted in packs. A current export leaves them empty; a restore
          reads them from an older document.
        type: integer
      archivedAt:
        type: string
      barcode:
        type: string
      categories:
        type: string
      co2KgPerKg:
        type: number
      countries:
        type: string
      createdAt:
        type: string
      daysAfterOpening:
        type: integer
      expireAt:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      isPrivate:
        type: boolean
      minStockAmount:
        type: integer
      notificationLeadDays:
        type: integer
      notifiedAt:
        type: string
      openedAt:
        type: string
      ownerUsername:
        type: string
      packSize:
        type: string
      priceOverride:
        type: number
      productName:
        type: string
      quantity:
        type: integer
      removalReason:
        type: string
      scannedAt:
        type: string
      storageLocation:
        $ref: '#/definitions/api.StorageLocationResponse'
      storageLocationId:
        type: integer
      unit:
        type: string
      wasteCause:
