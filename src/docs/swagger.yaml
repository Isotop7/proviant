      consumes:
      - multipart/form-data
      description: 'Creates products from an uploaded CSV file. Insert-only: a barcode
        that already exists among the household''s active products is reported as
        a row error and never modified. Unknown storage locations are created. Rows
        without a name are completed from the Open Food Facts cache, and at most a
        bounded number of them may additionally trigger a live Open Food Facts lookup.
        The quantity column counts the packs of a product and the pack_size column
        states the size of one pack; a file written before products were counted in
        packs is rejected.'
      parameters:
      - description: CSV file
        in: formData
