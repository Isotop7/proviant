        or category averages; CO2 is sourced from the Agribalyse LCA database via
        Open Food Facts ecoscore_data.
      parameters:
      - description: 'Period window: month | 3months | 6months | 12months (default
          6months). The window is floored to the first of the month for monthly-breakdown
          contiguity.'
