basePath: /
definitions:
  api.APIResponse:
    properties:
      action:
        type: string
      message:
        type: string
      reason:
        description: |-
          Reason is a stable machine-readable identifier of the cause. The message
          is prose and may be reworded; a client that has to branch on the cause
          reads this. It is not called "code" because the sign-in route answers
          with a numeric code on success and the two would collide.
        type: string
    type: object
  api.ActivityEntry:
    properties:
      action:
        type: string
      productId:
        type: integer
      productName:
        type: string
      quantity:
        type: integer
      timestamp:
        type: string
      userId:
        type: integer
      userName:
        type: string
      wasteCause:
        description: |-
          WasteCause is why the action wasted the product. It is empty for every
          action but a waste that carried a reason.
        type: string
    type: object
  api.ActivityLogResponse:
    properties:
      activities:
        items:
          $ref: '#/definitions/api.ActivityEntry'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.AuditLogResponse:
    properties:
      action:
        type: string
      details:
        type: string
      householdId:
        type: integer
      id:
        type: integer
      ipAddress:
        type: string
      requestId:
        type: string
      timestamp:
        type: string
      userId:
        type: integer
    type: object
  api.BulkActionResponse:
    properties:
      action:
        type: string
      failedIds:
        items:
          type: integer
        type: array
      message:
        type: string
      reason:
        description: |-
          Reason is a stable machine-readable identifier of the cause. The message
          is prose and may be reworded; a client that has to branch on the cause
          reads this. It is not called "code" because the sign-in route answers
          with a numeric code on success and the two would collide.
        type: string
    type: object
  api.BulkCreateRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/api.BulkProductDraft'
        type: array
    type: object
  api.BulkCreateResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/api.BulkItemResult'
        type: array
    type: object
  api.BulkItemResult:
    properties:
      index:
        type: integer
      productId:
        type: integer
      reason:
        type: string
      status:
        type: string
      terminal:
        description: |-
          Terminal marks a failed item whose reason is a property of the draft
          itself, so resubmitting it unchanged fails identically. A caller that
          retries asynchronously should surface such an item to the user instead of
          spending its retry budget on it.
        type: boolean
    type: object
  api.BulkProductDraft:
    properties:
      amount:
        description: |-
          Amount and Unit carry the net content of one pack, as a draft written
          before products were counted in packs carried it. A queued draft from
          before that change still carries it. A draft that carries only these is
          read as one pack of that net content.
        type: integer
      barcode:
        type: string
      categories:
        type: string
      categoryKey:
        description: |-
          CategoryKey is the canonical category the product belongs to. It is
          sent as null when the draft names no category.
        type: string
      daysAfterOpening:
        description: DaysAfterOpening is the shelf life after opening, in days.
        type: integer
      expireAt:
        description: ExpireAt is the expiry date the receipt carries, as an RFC 3339
          date.
        type: string
      isPrivate:
        type: boolean
      packSize:
        description: |-
          PackSize is the size of one pack as text ("1 l"), the display metadata
          the receipt read off the line.
        type: string
      price:
        description: |-
          Price is the price of the whole line, as the receipt prints it. The
          price of one pack is the line price divided by the count.
        type: number
      priceOverride:
        description: |-
          PriceOverride is the price of one pack, as a draft written before
          products were counted in packs carried it. A draft that carries only
          this field is read as the price of one pack; Price wins when both are
          present.
        type: number
      productName:
        type: string
      quantity:
        description: Quantity is the number of packs the product stands for.
        type: integer
      storageLocationId:
        description: StorageLocationID is the location the product is stored in.
        type: integer
      unit:
        type: string
    type: object
  api.BulkProductsAPIModel:
    properties:
      productIDs:
        items:
          type: integer
        type: array
      wasteCause:
        description: |-
          WasteCause is why the products are wasted. It applies to every product
          of the request and is ignored by a bulk consume.
        type: string
    type: object
  api.ConsumptionRateResponse:
    properties:
      daysCovered:
        type: integer
      display:
        type: string
      hasEstimate:
        type: boolean
      lastConsumed:
        type: string
      perWeek:
        type: number
      productId:
        type: integer
      sampleCount:
        type: integer
    type: object
  api.CookItemAPIModel:
    properties:
      productId:
        type: integer
      quantity:
        minimum: 0
        type: integer
    required:
    - productId
    type: object
  api.CookProductsAPIModel:
    properties:
      items:
        items:
          $ref: '#/definitions/api.CookItemAPIModel'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - items
    type: object
  api.CookRecipeRequest:
    properties:
      servings:
        minimum: 0
        type: integer
    type: object
  api.CookResponse:
    properties:
      consumed:
        type: integer
      errors:
        items:
          type: string
        type: array
      partial:
        type: integer
    type: object
  api.CreateHouseholdIntegrationRequest:
