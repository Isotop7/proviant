  api.OfflineSyncDraft:
    properties:
      amount:
        description: |-
          Amount and Unit carry the net content of one pack, as a draft written
          before products were counted in packs carried it. A queued draft from
          before that change still carries it. A draft that carries only these is
          read as one pack of that net content.
        type: integer
      barcode:
        type: string
      categories:
        type: string
      categoryKey:
        description: |-
          CategoryKey is the canonical category the product belongs to. It is
          sent as null when the draft names no category.
        type: string
      clientSyncId:
        type: string
      daysAfterOpening:
        description: DaysAfterOpening is the shelf life after opening, in days.
        type: integer
      expireAt:
        description: ExpireAt is the expiry date the receipt carries, as an RFC 3339
          date.
        type: string
      isPrivate:
        type: boolean
      packSize:
        description: |-
          PackSize is the size of one pack as text ("1 l"), the display metadata
          the receipt read off the line.
        type: string
      price:
        description: |-
          Price is the price of the whole line, as the receipt prints it. The
          price of one pack is the line price divided by the count.
        type: number
      priceOverride:
        description: |-
          PriceOverride is the price of one pack, as a draft written before
          products were counted in packs carried it. A draft that carries only
          this field is read as the price of one pack; Price wins when both are
          present.
        type: number
      productName:
        type: string
      quantity:
        description: Quantity is the number of packs the product stands for.
        type: integer
      storageLocationId:
        description: StorageLocationID is the location the product is stored in.
        type: integer
      unit:
        type: string
    type: object
  api.OfflineSyncRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/api.OfflineSyncDraft'
        type: array
    type: object
  api.OfflineSyncResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/api.OfflineSyncResult'
        type: array
    type: object
  api.OfflineSyncResult:
    properties:
      clientSyncId:
        type: string
      index:
        type: integer
      productId:
        type: integer
      reason:
        type: string
      status:
        type: string
      terminal:
        description: |-
          Terminal marks a failed item no resubmission can fix — a blank or
          over-long client sync id, or one held by a private product. The outbox
          parks such an item for the user instead of replaying it into the same
          failure until the retry budget runs out.
        type: boolean
    type: object
