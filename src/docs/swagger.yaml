  /api/v1/products/search:
    get:
      description: Returns a list of products based on a query. The response carries
        the products of the page, the total number of products the search matched,
        and the window that produced the page. The total counts every match, not the
        page. The matches that share the sort key keep the order of their ids, so
        a client that walks the pages by offset reads every match exactly once. A
        limit that is not set returns every match. A page ordered by the effective
        expiry is resolved before it is cut out, because the effective expiry has
        no sortable column — every page costs the same as reading every match.
      parameters:
      - description: Search field (product_name, barcode)
        in: query
        name: queryParam
        required: true
        type: string
      - description: Search value
        in: query
        name: queryValue
        required: true
        type: string
      - default: product_name
        description: Sort field (product_name, expire_at, created_at, scanned_at,
          notified_at, barcode, effective_expire_at)
        in: query
        name: sort
        type: string
      - default: asc
        description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      - description: Number of matches to return (max 1000). Without a limit every
          match is returned.
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of matches to skip before the first one returned
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ProductListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
