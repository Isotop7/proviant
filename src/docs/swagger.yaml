  /api/v1/products:
    get:
      description: 'Return a list of products of user. The list is ordered by the
        effective expiry by default — the earlier of the printed expiry and the opened-shelf-life
        date — with the products without a date last. A product that carries a shelf
        life is ordered by the date it goes off, not by the date printed on it. The
        order is the same on every request: products that share the sort key keep
        the order of their ids, so a client that walks the pages by offset reads every
        product exactly once. The response carries the products of the page, the total
        number of products the filter matched, and the window that produced the page.
        The total counts the whole set, not the page. An offset walk is stable as
        long as the household''s products do not change in between: a product that
        is added or removed shifts the rows behind it. A page ordered by the effective
        expiry is resolved before it is cut out, because the effective expiry has
        no sortable column — every page costs the same as reading the whole list.'
      parameters:
      - default: effective_expire_at
        description: Sort field (product_name, expire_at, created_at, effective_expire_at)
        in: query
        name: sort
        type: string
      - default: asc
        description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      - default: 100
        description: Number of products to return (1-1000)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of products to skip before the first one returned
        in: query
        name: offset
        type: integer
      - description: 'Ids of the products to return (comma separated, max 1000). ids
          wins over limit, offset and sort: the named products are returned in id
          order, unpaged, and the total is the number of them the caller may see.'
        in: query
        name: ids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ProductListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Return a list of products
      tags:
      - product
    post:
      consumes:
      - application/json
      description: 'Creates a new product of a user. The body carries the pack count
        and the size of one pack ("1 l"); a count below one is stored as one. The
        price is the price of one pack, so the savings of the product are that price
        times the number of packs. When the body carries a clientSyncId that already
        exists in the household, the existing product is returned with 200 instead
        of creating a duplicate. A clientSyncId held by another member''s private
        product is answered with 409: the id is taken, but the row is not the caller''s
        to read. A create that duplicates an active row of the household — the same
        barcode in the same storage location with the same effective expiry — is answered
        with 409 and the matched product in the body, so the client can ask whether
        to add a pack to it, to create a separate product, or to cancel. Archived
        rows and other members'' private products are never matches. A body that sets
        allowDuplicate skips the duplicate check and writes the row as it is.'
      parameters:
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/database.Product'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ProductResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ProductConflictResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Creates a new product
      tags:
      - product
  /api/v1/products/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a product of a user
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Archive only
        in: query
        name: archiveOnly
        type: boolean
      produces:
