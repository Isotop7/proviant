      expiredCount:
        type: integer
      expiringSoonCount:
        type: integer
      totalActive:
        type: integer
      wasteThisMonth:
        type: integer
    type: object
  api.PurchaseShoppingListItemRequest:
    properties:
      addToProductId:
        description: |-
          AddToProductID is the product the bought packs go into when it is not
          the product the item points at: the caller resolved a same-item
          conflict by hand.
        type: integer
      allowDuplicate:
        description: |-
          AllowDuplicate writes a second product instead of refusing when the
          bought product matches one the household already has.
        type: boolean
      barcode:
        description: |-
          Barcode identifies the bought product. An empty barcode leaves the
          product without one.
        type: string
      categoryKey:
        description: |-
          CategoryKey is the canonical category the bought product belongs to.
          It defaults to the category of the item.
        type: string
      expireAt:
        description: |-
          ExpireAt is the expiry date the user confirmed, as "2006-01-02" or an
          RFC 3339 timestamp. An empty value leaves the date to the household's
          category default.
        type: string
      packSize:
        description: |-
          PackSize is the size of one pack. It defaults to the size of the
          product the item points at.
        type: string
      quantity:
        description: |-
          Quantity is the number of packs bought. It defaults to the number of
          packs the item asked for; the two are not the same number.
        type: integer
      scanned:
        description: Scanned says the barcode was scanned rather than typed.
        type: boolean
      storageLocationId:
        description: StorageLocationID is where the bought packs go.
        type: integer
    type: object
  api.PurchaseShoppingListItemResponse:
    properties:
      created:
        description: |-
          Created says the purchase created a product. It is false when the
          bought packs went into the product the item already pointed at.
        type: boolean
      item:
        $ref: '#/definitions/api.ShoppingListItemResponse'
      product:
        $ref: '#/definitions/api.ProductResponse'
    type: object
  api.ReceiptItem:
    properties:
      name:
        type: string
      packSize:
        type: string
      price:
        type: number
      quantity:
        type: integer
    type: object
  api.ReceiptScanResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.ReceiptItem'
        type: array
    type: object
  api.RecipeIngredientInput:
    properties:
      name:
        maxLength: 255
        type: string
      portion:
        maxLength: 40
        type: string
      productId:
        type: integer
      sortOrder:
        type: integer
    required:
