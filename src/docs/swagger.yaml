basePath: /
definitions:
  api.APIResponse:
    properties:
      action:
        type: string
      message:
        type: string
    type: object
  api.ActivityEntry:
    properties:
      action:
        type: string
      productId:
        type: integer
      productName:
        type: string
      quantity:
        type: integer
      timestamp:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
  api.ActivityLogResponse:
    properties:
      activities:
        items:
          $ref: '#/definitions/api.ActivityEntry'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.ConsumptionRateResponse:
    properties:
      daysCovered:
        type: integer
      display:
        type: string
      hasEstimate:
        type: boolean
      lastConsumed:
        type: string
      perWeek:
        type: number
      productId:
        type: integer
      sampleCount:
        type: integer
      unit:
        type: string
    type: object
  api.CreateWebhookRequest:
    properties:
      active:
        type: boolean
      events:
        items:
          type: string
        minItems: 1
        type: array
      secret:
        minLength: 16
        type: string
      url:
        type: string
    required:
    - events
    - secret
    - url
    type: object
  api.ExpiryScanResponse:
    properties:
      confidence:
        description: 0.0–1.0
        type: number
      detectedDate:
        description: ISO 8601 (YYYY-MM-DD) if parsed, else empty
        type: string
      language:
        description: detected language if available
        type: string
      rawText:
        description: full OCR text for manual correction
        type: string
    type: object
  api.HouseholdListItem:
    properties:
      description:
        type: string
      id:
        type: integer
      memberCount:
        type: integer
      name:
        type: string
    type: object
  api.IngredientMatch:
    properties:
      matched:
        type: boolean
      name:
        type: string
    type: object
  api.NotificationItem:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  api.NotificationsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.NotificationItem'
        type: array
      total:
        type: integer
    type: object
  api.OnboardingStateResponse:
    properties:
      householdStepDone:
        type: boolean
      notificationsSetup:
        type: boolean
      onboardingCompleted:
        type: boolean
      profileStepDone:
        type: boolean
    type: object
  api.ProductAmountDTO:
    properties:
      delta:
        minimum: -1000
        type: integer
    required:
    - delta
    type: object
  api.ProductStatsResponse:
    properties:
      categories:
        additionalProperties:
          type: integer
        type: object
      expiringSoon:
        items:
          $ref: '#/definitions/api.StatsExpiringProduct'
        type: array
      expiringSoonDays:
        type: integer
      expiryTrend:
        items:
          $ref: '#/definitions/api.StatsMonthlyCount'
        type: array
      lastInsertedProduct:
        type: string
      totalActive:
        type: integer
      totalArchived:
        type: integer
      uniqueArchived:
        type: integer
      wasteCount:
        type: integer
      wastePercent:
        type: number
    type: object
  api.ProductSummaryResponse:
    properties:
      expiredCount:
        type: integer
      expiringSoonCount:
        type: integer
      totalActive:
        type: integer
      wasteThisMonth:
        type: integer
    type: object
  api.RecipeSuggestionResponse:
    properties:
      id:
        type: string
      imageUrl:
        type: string
      ingredients:
        items:
          $ref: '#/definitions/api.IngredientMatch'
        type: array
      matchPercent:
        description: 0-100
        type: number
      matchedProducts:
        description: deprecated, kept for compatibility
        items:
          type: string
        type: array
      missingCount:
        type: integer
      sourceUrl:
        type: string
      title:
        type: string
      totalIngredients:
        type: integer
    type: object
  api.RestockSuggestionResponse:
    properties:
      display:
        type: string
      hasEstimate:
        type: boolean
      hasSuggestion:
        type: boolean
      perWeekDisplay:
        type: string
      productId:
        type: integer
      productName:
        type: string
      sampleCount:
        type: integer
      source:
        type: string
      suggestedQty:
        type: integer
      unit:
        type: string
      weeklyRate:
        type: number
    type: object
  api.SavingsStatsResponse:
    properties:
      co2Source:
        type: string
      savedCo2KgLifetime:
        type: number
      savedCo2KgThisMonth:
        type: number
      savedEurLifetime:
        type: number
      savedEurThisMonth:
        type: number
      wastedCo2KgLifetime:
        type: number
      wastedCo2KgThisMonth:
        type: number
      wastedEurLifetime:
        type: number
      wastedEurThisMonth:
        type: number
    type: object
  api.StatsExpiringProduct:
    properties:
      expireAt:
        description: 'format: "2006-01-02"'
        type: string
      productName:
        type: string
    type: object
  api.StatsMonthlyCount:
    properties:
      count:
        type: integer
      month:
        description: 'format: "2006-01"'
        type: string
    type: object
  api.StreakResponse:
    properties:
      currentStreak:
        type: integer
      longestStreak:
        type: integer
    type: object
  api.WasteAnalyticsResponse:
    properties:
      co2Source:
        type: string
      consumedCount:
        type: integer
      monthly:
        items:
          $ref: '#/definitions/api.WasteMonthly'
        type: array
      mostWastedCategories:
        items:
          $ref: '#/definitions/api.WasteCategoryStat'
        type: array
      period:
        description: '"month" | "3months" | "6months" | "12months"'
        type: string
      sort:
        description: '"count" | "cost" — applied to mostWastedCategories'
        type: string
      totalRemoved:
        type: integer
      trend:
        items:
          $ref: '#/definitions/api.StatsMonthlyCount'
        type: array
      wastedCo2Kg:
        type: number
      wastedCount:
        type: integer
      wastedEur:
        type: number
      wastedPercent:
        type: number
    type: object
  api.WasteCategoryStat:
    properties:
      categoryKey:
        type: string
      co2Kg:
        type: number
      costEur:
        type: number
      count:
        type: integer
      displayName:
        type: string
      products:
        items:
          $ref: '#/definitions/api.WasteProductStat'
        type: array
    type: object
  api.WasteMonthly:
    properties:
      consumedCount:
        type: integer
      month:
        description: 'format: "2006-01"'
        type: string
      wastedCo2Kg:
        type: number
      wastedCount:
        type: integer
      wastedEur:
        type: number
    type: object
  api.WasteProductStat:
    properties:
      co2Kg:
        type: number
      costEur:
        type: number
      count:
        type: integer
      productName:
        type: string
    type: object
  api.WebhookResponse:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      events:
        items:
          type: string
        type: array
      id:
        type: integer
      updatedAt:
        type: string
      url:
        type: string
    type: object
  auth.acceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  authentication.Login:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  authentication.NotificationPreferences:
    properties:
      emailEnabled:
        type: boolean
      mailDigestFrequency:
        type: string
      monthlyWasteReportEnabled:
        type: boolean
      notificationThresholdDays:
        type: integer
      ntfyEnabled:
        type: boolean
      ntfyToken:
        type: string
      ntfyTopic:
        type: string
      ntfyUrl:
        type: string
      telegramBotConfigured:
        type: boolean
      telegramBotToken:
        type: string
      telegramEnabled:
        type: boolean
      telegramLinked:
        type: boolean
      webPushEnabled:
        type: boolean
    type: object
  authentication.Signup:
    properties:
      inviteToken:
        type: string
      mailAddress:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - mailAddress
    - password
    - username
    type: object
  authentication.User:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      displayName:
        type: string
      emailVerifiedAt:
        type: string
      household:
        $ref: '#/definitions/database.Household'
      householdID:
        type: integer
      id:
        type: integer
      mailAddress:
        type: string
      notificationPreferences:
        $ref: '#/definitions/authentication.NotificationPreferences'
      role:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
  database.AuditLog:
    properties:
      action:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      details:
        type: string
      id:
        type: integer
      ipAddress:
        type: string
      requestId:
        type: string
      timestamp:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  database.Household:
    properties:
      adminID:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: integer
      monthlyWasteGoalCount:
        description: nil = disabled
        type: integer
      monthlyWasteGoalPercent:
        description: nil = disabled
        type: number
      monthlyWasteGoalType:
        description: '"", "count", or "percent"'
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  database.HouseholdApplication:
    properties:
      applicantId:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      householdId:
        type: integer
      id:
        type: integer
      status:
        type: string
      updatedAt:
        type: string
    type: object
  database.HouseholdInvitation:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      expiresAt:
        type: string
      householdId:
        type: integer
      id:
        type: integer
      inviterId:
        type: integer
      sendAttempts:
        type: integer
      sentAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  database.OpenFoodFactsCache:
    properties:
      barcode:
        type: string
      categories:
        type: string
      co2KgPerKg:
        type: number
      countries:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      imageUrl:
        type: string
      productName:
        type: string
      storageHint:
        type: string
      updatedAt:
        type: string
    type: object
  database.Product:
    properties:
      amount:
        type: integer
      barcode:
        type: string
      categories:
        type: string
      co2KgPerKg:
        type: number
      countries:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      expireAt:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      isPrivate:
        type: boolean
      minStockAmount:
        type: integer
      notificationLeadDays:
        type: integer
      notifiedAt:
        type: string
      priceOverride:
        type: number
      productName:
        type: string
      removalReason:
        type: string
      scannedAt:
        type: string
      storageLocation:
        $ref: '#/definitions/database.StorageLocation'
      storageLocationId:
        type: integer
      unit:
        type: string
      updatedAt:
        type: string
    type: object
  database.ProductDTOBarcode:
    properties:
      barcode:
        type: string
    type: object
  database.ProductDTOExpire:
    properties:
      barcode:
        type: string
      expireAt:
        type: string
      id:
        type: integer
    type: object
  database.StorageLocation:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      householdId:
        type: integer
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      sortOrder:
        type: integer
      updatedAt:
        type: string
    type: object
  database.Timestamp:
    properties:
      timestamp:
        type: string
    required:
    - timestamp
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  v1.CalendarTokenResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
      url:
        type: string
    type: object
  v1.FullExportHousehold:
    properties:
      created_at:
        type: string
      name:
        type: string
    type: object
  v1.FullExportMember:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  v1.FullExportProducts:
    properties:
      active:
        items:
          $ref: '#/definitions/database.Product'
        type: array
      archived:
        items:
          $ref: '#/definitions/database.Product'
        type: array
    type: object
  v1.FullExportResponse:
    properties:
      exported_at:
        type: string
      household:
        $ref: '#/definitions/v1.FullExportHousehold'
      members:
        items:
          $ref: '#/definitions/v1.FullExportMember'
        type: array
      products:
        $ref: '#/definitions/v1.FullExportProducts'
      stats:
        $ref: '#/definitions/api.ProductStatsResponse'
    type: object
  v1.createHouseholdRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  v1.createInvitationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  v1.storageLocationRequest:
    properties:
      icon:
        type: string
      name:
        type: string
      sortOrder:
        type: integer
    required:
    - name
    type: object
  v1.updateAdminUserRequest:
    properties:
      mailAddress:
        type: string
      username:
        type: string
    type: object
  v1.updateHouseholdMemberRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  v1.updateHouseholdNameRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:5050
info:
  contact:
    email: hendrik@hr94.de
    name: Isotop7
    url: https://codeberg.org/isotop7/proviant
  description: proviant is a simple and intuitive application to track your bought
    products and their expiration date to prevent waste of food.
  license:
    name: MIT
    url: https://codeberg.org/isotop7/proviant/-/blob/main/LICENSE
  title: proviant
  version: 0.2.0
paths:
  /api/health:
    get:
      consumes:
      - application/json
      description: Gets health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Gets health
      tags:
      - common
  /api/v1/admin/audit-log:
    get:
      description: Returns paginated audit log entries (admin only)
      parameters:
      - description: Maximum number of logs to return (default 100, max 1000)
        in: query
        name: limit
        type: integer
      - description: Filter by date (YYYY-MM-DD format)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.AuditLog'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get audit logs
      tags:
      - admin
  /api/v1/calendar/export.ics:
    get:
      description: Returns an iCalendar (RFC 5545) feed with VEVENTs for products
        expiring in the next 30 days. Use the token query parameter for authentication.
      parameters:
      - description: Calendar token for authentication
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: iCalendar feed
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Export iCalendar feed
      tags:
      - calendar
  /api/v1/calendar/token:
    delete:
      consumes:
      - application/json
      description: Removes the personal calendar token, invalidating any active iCal/CalDAV
        subscriptions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete calendar token
      tags:
      - calendar
    get:
      consumes:
      - application/json
      description: Returns whether the user has a calendar token and the subscription
        URL for iCal/CalDAV.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get calendar token status
      tags:
      - calendar
    post:
      consumes:
      - application/json
      description: Creates or regenerates a personal calendar token for iCal/CalDAV
        subscription. Old token is invalidated.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CalendarTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Create calendar token
      tags:
      - calendar
  /api/v1/calendar/token/rotate:
    post:
      consumes:
      - application/json
      description: Invalidates the current calendar token and creates a new one with
        a fresh expiry date.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CalendarTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Rotate calendar token
      tags:
      - calendar
  /api/v1/household/{id}/apply:
    post:
      description: Creates a pending application for the calling user to join the
        specified household.
      parameters:
      - description: Household ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Apply to join a household
      tags:
      - household
  /api/v1/household/activity:
    get:
      description: Returns paginated activity log entries for the household the caller
        belongs to.
      parameters:
      - description: Max entries to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of entries to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ActivityLogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get household activity feed
      tags:
      - household
  /api/v1/household/applications:
    get:
      description: Returns pending join applications for the household the calling
        user is admin of.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.HouseholdApplication'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: List pending household applications
      tags:
      - household
  /api/v1/household/applications/{id}:
    delete:
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Cancel own household application
      tags:
      - household
  /api/v1/household/applications/{id}/approve:
    post:
      description: Moves the applicant into the household. Caller must be the household
        admin.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
