# Live config: Automatic Analysis reads this file and ignores sonar-project.properties.
# Only sonar.sources/sonar.tests reject wildcards.
# Read from the default branch (main) and from pull requests.
#
# The whole repository is in scope on purpose: the GitHub Actions workflows, the
# shell scripts and the Dockerfiles are where the security-relevant findings
# (unpinned actions, secrets in run blocks, a missing --ignore-scripts) live. A
# source scope of "src" alone drops them from the report once they are fixed.
#
# What stays out is what never ships: the design-system mockups, the local build
# tooling (*.py, *.mjs), the Vitest specs and the agent skills.
sonar.sources=.
sonar.tests=src
sonar.test.inclusions=**/*_test.go

sonar.exclusions=\
    **/design-system/**,\
    **/docs/**,\
    **/data/**,\
    **/.agents/**,\
    **/tests/**,\
    **/*.py,\
    **/*.mjs,\
    src/assets/css/**,\
    src/assets/fonts/**,\
    src/assets/icons/**,\
    **/*.gen.go,\
    **/*.min.js,\
    **/vendor/**,\
    **/node_modules/**

sonar.cpd.exclusions=**/i18n/catalogs/**

sonar.sourceEncoding=UTF-8
