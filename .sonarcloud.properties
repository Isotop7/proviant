# Live config: Automatic Analysis reads this file and ignores sonar-project.properties, which
# mirrors the exclusion and cpd lists below. Only sonar.sources/sonar.tests reject wildcards.
# Read from the default branch (main) and from pull requests.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*_test.go

sonar.exclusions=\
    **/design-system/**,\
    **/docs/**,\
    **/data/**,\
    src/assets/css/**,\
    src/assets/fonts/**,\
    src/assets/icons/**,\
    **/*.gen.go,\
    **/*.min.js,\
    **/vendor/**,\
    **/node_modules/**

sonar.cpd.exclusions=**/i18n/catalogs/**

sonar.sourceEncoding=UTF-8
