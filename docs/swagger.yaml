basePath: /
definitions:
  api.APIResponse:
    properties:
      message:
        type: string
    type: object
  api.HouseholdListItem:
    properties:
      description:
        type: string
      id:
        type: integer
      memberCount:
        type: integer
      name:
        type: string
    type: object
  api.OnboardingStateResponse:
    properties:
      householdStepDone:
        type: boolean
      notificationsSetup:
        type: boolean
      onboardingCompleted:
        type: boolean
    type: object
  api.ProductStatsResponse:
    properties:
      categories:
        additionalProperties:
          type: integer
        type: object
      expiryTrend:
        items:
          $ref: '#/definitions/api.StatsMonthlyCount'
        type: array
      lastInsertedProduct:
        type: string
      topProducts:
        items:
          $ref: '#/definitions/api.StatsTopProduct'
        type: array
      totalActive:
        type: integer
      totalArchived:
        type: integer
      uniqueArchived:
        type: integer
      wasteCount:
        type: integer
      wastePercent:
        type: number
    type: object
  api.StatsMonthlyCount:
    properties:
      count:
        type: integer
      month:
        description: 'format: "2006-01"'
        type: string
    type: object
  api.StatsTopProduct:
    properties:
      barcode:
        type: string
      count:
        type: integer
      productName:
        type: string
    type: object
  auth.acceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  authentication.Login:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  authentication.NotificationPreferences:
    properties:
      emailEnabled:
        type: boolean
      ntfyEnabled:
        type: boolean
      ntfyToken:
        type: string
      ntfyTopic:
        type: string
      ntfyUrl:
        type: string
    type: object
  authentication.Signup:
    properties:
      inviteToken:
        type: string
      mailAddress:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - mailAddress
    - password
    - username
    type: object
  authentication.User:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      household:
        $ref: '#/definitions/database.Household'
      householdID:
        type: integer
      id:
        type: integer
      mailAddress:
        type: string
      notificationPreferences:
        $ref: '#/definitions/authentication.NotificationPreferences'
      updatedAt:
        type: string
      username:
        type: string
    type: object
  database.Household:
    properties:
      adminID:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    type: object
  database.HouseholdApplication:
    properties:
      applicantId:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      householdId:
        type: integer
      id:
        type: integer
      status:
        type: string
      updatedAt:
        type: string
    type: object
  database.HouseholdInvitation:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      expiresAt:
        type: string
      householdId:
        type: integer
      id:
        type: integer
      inviterId:
        type: integer
      sendAttempts:
        type: integer
      sentAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  database.OpenFoodFactsCache:
    properties:
      barcode:
        type: string
      categories:
        type: string
      countries:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      imageUrl:
        type: string
      productName:
        type: string
      updatedAt:
        type: string
    type: object
  database.Product:
    properties:
      barcode:
        type: string
      categories:
        type: string
      countries:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      expireAt:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      notifiedAt:
        type: string
      productName:
        type: string
      scannedAt:
        type: string
      updatedAt:
        type: string
    type: object
  database.ProductDTOBarcode:
    properties:
      barcode:
        type: string
    type: object
  database.ProductDTOExpire:
    properties:
      barcode:
        type: string
      expireAt:
        type: string
      id:
        type: integer
    type: object
  database.Timestamp:
    properties:
      timestamp:
        type: string
    required:
    - timestamp
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  v1.createHouseholdRequest:
    properties:
      name:
        type: string
    type: object
  v1.createInvitationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  v1.updateHouseholdNameRequest:
    properties:
      name:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:5050
info:
  contact:
    email: hendrik@hr94.de
    name: Isotop7
    url: https://codeberg.org/isotop7/proviant
  description: proviant is a simple and intuitive application to track your bought
    products and their expiration date to prevent waste of food.
  license:
    name: MIT
    url: https://codeberg.org/isotop7/proviant/-/blob/main/LICENSE
  title: proviant
  version: 0.2.0
paths:
  /api/health:
    get:
      consumes:
      - application/json
      description: Gets health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Gets health
      tags:
      - common
  /api/v1/household/{id}/apply:
    post:
      description: Creates a pending application for the calling user to join the
        specified household.
      parameters:
      - description: Household ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Apply to join a household
      tags:
      - household
  /api/v1/household/applications:
    get:
      description: Returns pending join applications for the household the calling
        user is admin of.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.HouseholdApplication'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: List pending household applications
      tags:
      - household
  /api/v1/household/applications/{id}:
    delete:
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Cancel own household application
      tags:
      - household
  /api/v1/household/applications/{id}/approve:
    post:
      description: Moves the applicant into the household. Caller must be the household
        admin.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Approve a household application
      tags:
      - household
  /api/v1/household/applications/{id}/reject:
    post:
      description: Marks the application as rejected. Caller must be the household
        admin.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Reject a household application
      tags:
      - household
  /api/v1/household/invitations:
    get:
      description: Returns all invitations for the calling user's household
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.HouseholdInvitation'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get household invitations
      tags:
      - Invitation
    post:
      consumes:
      - application/json
      description: Creates a new household invitation and sends an email to the recipient
      parameters:
      - description: Invitation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.createInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Create invitation
      tags:
      - Invitation
  /api/v1/household/invitations/{id}:
    delete:
      description: Cancels a pending invitation by ID
      parameters:
      - description: Invitation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Cancel invitation
      tags:
      - Invitation
  /api/v1/household/members/{userId}:
    delete:
      parameters:
      - description: User ID to remove
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Remove a household member
      tags:
      - household
  /api/v1/household/name:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Name
        in: body
        name: household
        required: true
        schema:
          $ref: '#/definitions/v1.updateHouseholdNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Rename household
      tags:
      - household
  /api/v1/onboarding/apply-household:
    post:
      consumes:
      - application/json
      description: Submits an application to join a household during onboarding
      parameters:
      - description: Household ID
        in: body
        name: householdId
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Apply for household
      tags:
      - onboarding
  /api/v1/onboarding/complete:
    post:
      description: Marks the onboarding process as complete
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Complete onboarding
      tags:
      - onboarding
  /api/v1/onboarding/households:
    get:
      description: Returns a list of households that the user can apply to join
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.HouseholdListItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get available households
      tags:
      - onboarding
  /api/v1/onboarding/state:
    get:
      description: Returns the current onboarding progress for the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OnboardingStateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get onboarding state
      tags:
      - onboarding
  /api/v1/product/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a product of a user
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Archive only
        in: query
        name: archiveOnly
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Deletes a product
      tags:
      - product
    get:
      description: Returns a single product of user
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Returns a single product
      tags:
      - product
    patch:
      consumes:
      - application/json
      description: Updates a product with new values
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/database.Product'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Updates a product
      tags:
      - product
  /api/v1/product/{id}/expire:
    post:
      consumes:
      - application/json
      description: Updates the expire date of a product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Timestamp
        in: body
        name: timestamp
        required: true
        schema:
          $ref: '#/definitions/database.Timestamp'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.ProductDTOExpire'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Updates the expire date
      tags:
      - product
  /api/v1/product/{id}/restore:
    post:
      consumes:
      - application/json
      description: Restores an archived product of a user
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Restores a product
      tags:
      - product
  /api/v1/product/bulkArchive:
    delete:
      consumes:
      - application/json
      description: Archives a list of products of a user
      parameters:
      - description: Product IDs
        in: body
        name: productIDs
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Archives a list of products
      tags:
      - product
  /api/v1/product/bulkDelete:
    delete:
      consumes:
      - application/json
      description: Deletes a list of products of a user
      parameters:
      - description: Product IDs
        in: body
        name: productIDs
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Deletes a list of products
      tags:
      - product
  /api/v1/product/bulkRestore:
    post:
      consumes:
      - application/json
      description: Restores a list of product of a user
      parameters:
      - description: Product IDs
        in: body
        name: productIDs
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Restores a list of product
      tags:
      - product
  /api/v1/products:
    get:
      description: Return a list of products of user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Product'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Return a list of products
      tags:
      - product
    post:
      consumes:
      - application/json
      description: Creates a new product of a user
      parameters:
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/database.Product'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Creates a new product
      tags:
      - product
  /api/v1/products/archived:
    get:
      description: Return a list of archived products of user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Product'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
