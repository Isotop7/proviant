name: CI

env:
  GO_VERSION: 1.26.8
  GOLANGCI_LINT_VERSION: v2.12.2
  PRIVATE_REGISTRY: registry.hr94.de

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify modules
        run: |
          cd ./src
          go mod verify
      - name: Lint code
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: src
      - name: Scan for vulnerabilities
        run: |
          cd ./src
          go run golang.org/x/vuln/cmd/govulncheck@latest -json ./... > govulncheck.json
      - name: Create vulnerability issues
        if: failure()
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.repository }}"

          EXISTING_IDS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$OWNER/$REPO/issues?state=open&labels=vulnerability" \
            | jq -r '.[].title | split(": ")[1] // empty | split(" ")[0]' 2>/dev/null || true)

          jq -c '.problems[]' "$WORKSPACE/src/govulncheck.json" 2>/dev/null | while read -r ISSUE; do
            ID=$(echo "$ISSUE" | jq -r '.issueID')
            PKG=$(echo "$ISSUE" | jq -r '.pkgPath')
            DESC=$(echo "$ISSUE" | jq -r '.description')
            FIXED=$(echo "$ISSUE" | jq -r '.fixedVersion // "unknown"')

            if echo "$EXISTING_IDS" | grep -qF "$ID"; then
              echo "Issue for $ID already exists, skipping"
              continue
            fi

            BODY=$(jq -n --arg id "$ID" --arg pkg "$PKG" --arg fix "$FIXED" --arg desc "$DESC" \
              '("## Vulnerability Detected\n\n**ID:** `" + $id + "`\n**Package:** `" + $pkg + "`\n**Fixed Version:** `" + $fix + "`\n\n" + $desc + "\n\n---\n*This issue was automatically created by the CI vulnerability scanner.*")')

            curl -s -X POST \
              "https://api.github.com/repos/$OWNER/$REPO/issues" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -d "$(jq -n --arg title "Vulnerability: $ID" --arg body "$BODY" \
                  '{title: $title, body: $body, labels: ["security", "vulnerability"]}')"
            echo "Created issue for $ID"
          done
      - name: Test code
        run: |
          cd ./src
          go test -race $(go list ./... | grep -v /vendor/)
      - name: Test code coverage
        run: |
          cd ./src
          go test -coverprofile=coverage.out ./... &&
          go mod verify
      - name: Check coverage threshold
        run: |
          cd ./src
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          if (( $(echo "$COVERAGE < 15" | bc -l) )); then
            echo "Coverage is $COVERAGE%, below minimum threshold of 15%"
            exit 1
          fi
          echo "Coverage is $COVERAGE%, above minimum threshold of 15%"
      - name: Compile code
        run: |
          cd ./src
          mkdir -p release
          go build -o release ./...

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint CSS
        run: npm run lint-css
      - name: Lint JS
        run: npm run lint-js
      - name: Lint HTML
        run: npm run lint-html

  docker-build-and-push:
    needs: check
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
            ${{ env.PRIVATE_REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
            ${{ env.PRIVATE_REGISTRY }}/${{ github.repository }}:latest
      - name: Build and push Demo Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile.demo
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:demo
            ${{ env.PRIVATE_REGISTRY }}/${{ github.repository }}:demo

  sonarcloud-scan:
    needs: check
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run SonarCloud scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
