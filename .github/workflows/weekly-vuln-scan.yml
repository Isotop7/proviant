name: Weekly Vulnerability Scan

env:
  GO_VERSION: 1.26.10

on:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Scan for vulnerabilities
        run: |
          cd ./src
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        uses: ./.github/actions/npm-audit

  image-scan:
    runs-on: ubuntu-latest
    # Cold-cache budget: full CGO+npm image build plus the trivy DB download
    # and scan. Keep above the worst realistic build+scan.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ./Dockerfile
          push: false
          load: true
          # Nothing ships from this workflow, so attestations are pointless —
          # and the docker exporter cannot carry them. Set explicitly so the
          # build does not depend on buildx's exporter/attestation defaults.
          provenance: false
          sbom: false
          platforms: linux/amd64
          # Own scope: sharing ci.yml's proviant-scan-prod-amd64 makes the two
          # workflows collide on the same actions/cache reservation, and GHA
          # cache writes are not transactional.
          cache-from: type=gha,scope=proviant-weekly-scan-prod-amd64
          cache-to: type=gha,mode=max,scope=proviant-weekly-scan-prod-amd64
          tags: proviant:scan
      - name: Cache trivy vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/trivy
          # run_id (not a constant) so the cache is re-saved with the DB trivy
          # actually used this run. A fixed key makes actions/cache skip every
          # save after the first, pinning the DB to whatever day one shipped and
          # re-downloading ~50 MB on every run.
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Export image tarball for the scan
        env:
          SCAN_TARBALL: ${{ runner.temp }}/proviant-image.tar
        run: docker save -o "$SCAN_TARBALL" proviant:scan
      - name: Scan image
        id: scan
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          SCAN_TARBALL: ${{ runner.temp }}/proviant-image.tar
        run: bash scripts/image-scan.sh "$SCAN_TARBALL"
      # Skip when the scan never ran: an empty upload warns "No files were
      # found" and buries the real failure above it.
      - name: Upload scan report
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-weekly-report
          path: trivy-report.json
          retention-days: 14
