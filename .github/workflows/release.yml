name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout main branch
        run: |
          git checkout main
          git pull origin main

      - name: Install git-cliff
        uses: https://github.com/taiki-e/install-action@git-cliff

      - name: Generate full changelog
        run: |
          git-cliff --config cliff.toml --verbose --output CHANGELOG.md

      - name: Configure git
        run: |
          git config user.name "proviant-release-bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: Commit CHANGELOG.md
        run: |
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          git fetch origin main:tmp-main
          git checkout tmp-main -- CHANGELOG.md

      - name: Generate release notes
        id: notes
        run: |
          current_tag="${{ github.ref_name }}"
          all_tags_sorted=$(git tag --sort=-v:refname)
          previous_tag=$(echo "$all_tags_sorted" | grep -A100 "^${current_tag}$" | sed -n '2p')
          if [ -z "$previous_tag" ]; then
            echo "notes<<EOF" > /tmp/notes.md
            echo "# Release $current_tag" >> /tmp/notes.md
            git-cliff --config cliff.toml --verbose >> /tmp/notes.md
            echo "EOF" >> /tmp/notes.md
          else
            git-cliff --config cliff.toml --verbose "$previous_tag..$current_tag" --output /tmp/notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: false
          files: CHANGELOG.md
