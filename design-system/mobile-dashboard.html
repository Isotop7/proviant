<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(0.14 0.01 70); font-family: var(--font-ui); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 32px; gap: 40px; flex-wrap: wrap; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../ios-frame.jsx"></script>
<script type="text/babel">

const ACCENT = 'oklch(0.50 0.12 162)';
const FG     = 'oklch(0.18 0.022 70)';
const FG2    = 'oklch(0.48 0.018 70)';
const FG3    = 'oklch(0.65 0.012 70)';
const BG     = 'oklch(0.98 0.012 75)';
const BORDER = 'oklch(0.88 0.010 75)';
const WHITE  = '#ffffff';

const PRODUCTS = [
  { name:'Whole Milk 1L',   cat:'Dairy',     status:'critical', color:'oklch(0.64 0.18 45)',  label:'in 2 days' },
  { name:'Greek Yogurt',    cat:'Dairy',     status:'expired',  color:'oklch(0.55 0.20 25)',  label:'Expired'   },
  { name:'Sourdough Bread', cat:'Bakery',    status:'soon',     color:'oklch(0.72 0.16 80)',  label:'in 4 days' },
];

function ProductRow({ p }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 14px', borderBottom:`1px solid ${BORDER}` }}>
      <div style={{ width:34, height:34, borderRadius:8, background:'oklch(0.93 0.04 162)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <i className="bi bi-box-seam" style={{ color:ACCENT, fontSize:15 }} />
      </div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:13, fontWeight:600, color:FG, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
        <div style={{ fontSize:11, color:FG3 }}>{p.cat}</div>
      </div>
      <span style={{ fontSize:10, fontWeight:600, padding:'2px 8px', borderRadius:999, background:`${p.color}22`, color:p.color, border:`1px solid ${p.color}55`, whiteSpace:'nowrap' }}>{p.label}</span>
    </div>
  );
}

function BottomNav({ active='dashboard' }) {
  return (
    <div style={{ position:'absolute', bottom:0, left:0, right:0, background:WHITE, borderTop:`1px solid ${BORDER}`, display:'flex', paddingBottom:20, zIndex:30, boxShadow:'0 -4px 20px oklch(0.18 0.022 70 / 0.08)' }}>
      {[['bi-speedometer2','Dashboard'],['bi-box-seam','Products'],['bi-upc-scan','Scan'],['bi-archive','Archive'],['bi-person-circle','Settings']].map(([icon,label])=>(
        <button key={label} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'10px 0', background:'none', border:'none', cursor:'pointer' }}>
          <i className={`bi ${icon}`} style={{ fontSize: label==='Scan' ? 26 : 22, color: label===active.charAt(0).toUpperCase()+active.slice(1) ? ACCENT : FG3 }} />
          <span style={{ fontSize:10, color: label===active.charAt(0).toUpperCase()+active.slice(1) ? ACCENT : FG3, fontFamily:'var(--font-ui)', fontWeight: label===active.charAt(0).toUpperCase()+active.slice(1) ? 700 : 400 }}>{label}</span>
        </button>
      ))}
    </div>
  );
}

function MobileDashboard() {
  const [sheet, setSheet] = React.useState(false);
  return (
    <div style={{ position:'relative', height:'100%', display:'flex', flexDirection:'column', background:BG }}>
      {/* Topbar */}
      <div style={{ background:WHITE, borderBottom:`1px solid ${BORDER}`, padding:'12px 16px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <img src="../assets/header.png" alt="Proviant" style={{ height:26, objectFit:'contain' }} />
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ position:'relative' }}>
            <i className="bi bi-bell" style={{ fontSize:20, color:FG2 }} />
            <div style={{ position:'absolute', top:-2, right:-2, width:8, height:8, borderRadius:99, background:'oklch(0.55 0.20 25)', border:`1.5px solid ${WHITE}` }} />
          </div>
          <div style={{ width:30, height:30, borderRadius:999, background:'oklch(0.93 0.04 162)', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ fontSize:12, fontWeight:700, color:ACCENT }}>J</span>
          </div>
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'14px 14px 90px', display:'flex', flexDirection:'column', gap:12 }}>

        {/* Greeting */}
        <div>
          <div style={{ fontSize:20, fontWeight:700, color:FG, letterSpacing:'-0.02em' }}>Good morning, Jonas</div>
          <div style={{ fontSize:12, color:FG3, marginTop:2 }}>Sunday, April 20 · 10 products tracked</div>
        </div>

        {/* Hero scan card */}
        <button onClick={() => setSheet(true)} style={{ background:ACCENT, borderRadius:16, padding:'18px', border:'none', cursor:'pointer', textAlign:'left', position:'relative', overflow:'hidden', width:'100%', boxShadow:`0 8px 24px ${ACCENT}44` }}>
          <div style={{ position:'absolute', right:-16, top:-16, width:100, height:100, borderRadius:999, background:'rgba(255,255,255,0.08)' }} />
          <div style={{ position:'absolute', right:16, bottom:-24, width:70, height:70, borderRadius:999, background:'rgba(255,255,255,0.06)' }} />
          <div style={{ position:'relative' }}>
            <div style={{ fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.65)', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>Quick action</div>
            <div style={{ fontSize:18, fontWeight:700, color:WHITE, marginBottom:3 }}>Scan a product</div>
            <div style={{ fontSize:12, color:'rgba(255,255,255,0.7)', marginBottom:14 }}>Add to your pantry in seconds</div>
            <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:'rgba(255,255,255,0.2)', borderRadius:99, padding:'7px 14px' }}>
              <i className="bi bi-upc-scan" style={{ color:WHITE, fontSize:14 }} />
              <span style={{ color:WHITE, fontSize:12, fontWeight:600 }}>Start scanning</span>
            </div>
          </div>
        </button>

        {/* Stats row */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {[
            ['Expired','2','oklch(0.55 0.20 25)','bi-x-circle-fill'],
            ['Expiring soon','2','oklch(0.64 0.18 45)','bi-exclamation-circle-fill'],
          ].map(([l,v,c,ic])=>(
            <div key={l} style={{ background:WHITE, border:`1px solid ${BORDER}`, borderRadius:12, padding:'14px 12px' }}>
              <i className={`bi ${ic}`} style={{ color:c, fontSize:18, marginBottom:6, display:'block' }} />
              <div style={{ fontSize:22, fontWeight:700, color:c, letterSpacing:'-0.02em' }}>{v}</div>
              <div style={{ fontSize:11, color:FG3, marginTop:2 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* Needs attention */}
        <div style={{ background:WHITE, border:`1px solid ${BORDER}`, borderRadius:12, overflow:'hidden' }}>
          <div style={{ padding:'10px 14px 6px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div style={{ fontSize:11, fontWeight:600, color:FG3, textTransform:'uppercase', letterSpacing:'0.06em' }}>Needs attention</div>
            <span style={{ fontSize:11, color:ACCENT, fontWeight:600 }}>See all</span>
          </div>
          {PRODUCTS.map(p=><ProductRow key={p.name} p={p}/>)}
        </div>

      </div>

      <BottomNav active="dashboard" />

      {/* Bottom sheet */}
      {sheet && (
        <div style={{ position:'absolute', inset:0, zIndex:50 }}>
          <div onClick={() => setSheet(false)} style={{ position:'absolute', inset:0, background:'oklch(0.18 0.022 70 / 0.45)', animation:'fadeIn 200ms ease-out' }} />
          <div style={{ position:'absolute', bottom:0, left:0, right:0, background:WHITE, borderRadius:'20px 20px 0 0', height:300, animation:'slideUp 280ms cubic-bezier(0.16,1,0.3,1)', display:'flex', flexDirection:'column' }}>
            <div style={{ width:36, height:4, borderRadius:99, background:BORDER, margin:'10px auto 6px', flexShrink:0 }} />
            <div style={{ padding:'4px 16px 16px', flex:1 }}>
              <div style={{ fontSize:16, fontWeight:700, color:FG, marginBottom:14 }}>Add product</div>
              <button style={{ width:'100%', background:ACCENT, color:WHITE, border:'none', borderRadius:12, padding:'16px', cursor:'pointer', display:'flex', alignItems:'center', gap:14, textAlign:'left' }}>
                <div style={{ width:40, height:40, borderRadius:10, background:'rgba(255,255,255,0.15)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                  <i className="bi bi-upc-scan" style={{ fontSize:20, color:WHITE }} />
                </div>
                <div>
                  <div style={{ fontSize:14, fontWeight:700 }}>Scan barcode</div>
                  <div style={{ fontSize:12, opacity:0.75, marginTop:2 }}>Point camera at any EAN barcode</div>
                </div>
              </button>
              <div style={{ marginTop:12 }}>
                <div style={{ fontSize:11, color:FG3, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.06em' }}>Or enter manually</div>
                <div style={{ display:'flex', alignItems:'center', gap:8, background:BG, border:`1px solid ${BORDER}`, borderRadius:10, padding:'10px 14px' }}>
                  <i className="bi bi-upc" style={{ color:FG3, fontSize:16 }} />
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:13, color:FG3 }}>13-digit EAN barcode</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const SCALE = 0.52;
  const W = 393, H = 852;
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:'oklch(0.55 0.02 70)', marginBottom:6 }}>Mobile Dashboard</div>
        <div style={{ fontSize:22, fontWeight:700, color:'white', letterSpacing:'-0.02em', marginBottom:4 }}>Dashboard with scan hero</div>
        <div style={{ fontSize:13, color:'oklch(0.55 0.02 70)' }}>Tap the scan card to see the sheet · bottom nav: Scan tab is primary CTA</div>
      </div>
      <div style={{ transform:`scale(${SCALE})`, transformOrigin:'top center', width:W, height:H }}>
        <IOSDevice width={W} height={H}><MobileDashboard /></IOSDevice>
      </div>
      <div style={{ marginTop: H * SCALE - H - 8 }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
