<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(0.12 0.01 70); font-family: var(--font-ui); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
  @keyframes slideIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideRight { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
  @keyframes scanFlash { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../browser-window.jsx"></script>
<script type="text/babel">

/* ── SHARED TOKENS ── */
const A  = 'oklch(0.50 0.12 162)';
const AH = 'oklch(0.44 0.12 162)';
const AS = 'oklch(0.93 0.04 162)';
const FG = 'oklch(0.18 0.022 70)';
const F2 = 'oklch(0.48 0.018 70)';
const F3 = 'oklch(0.65 0.012 70)';
const BG = 'oklch(0.98 0.012 75)';
const BS = 'oklch(0.96 0.008 75)';
const BD = 'oklch(0.88 0.010 75)';
const WH = '#ffffff';

/* ── SHARED COMPONENTS ── */

const PRODUCTS = [
  { name:'Whole Milk 1L',    cat:'Dairy',     status:'critical', color:'oklch(0.64 0.18 45)',  label:'in 2 days' },
  { name:'Greek Yogurt',     cat:'Dairy',     status:'expired',  color:'oklch(0.55 0.20 25)',  label:'Expired'   },
  { name:'Orange Juice',     cat:'Beverages', status:'fresh',    color:'oklch(0.50 0.12 162)', label:'Fresh'     },
  { name:'Sourdough Bread',  cat:'Bakery',    status:'soon',     color:'oklch(0.72 0.16 80)',  label:'in 4 days' },
  { name:'Olive Oil',        cat:'Pantry',    status:'nodate',   color:'oklch(0.60 0.010 70)', label:'No date'   },
  { name:'Cheddar Cheese',   cat:'Dairy',     status:'soon',     color:'oklch(0.72 0.16 80)',  label:'in 6 days' },
];

function Sidebar({ active='products' }) {
  const items = [
    { id:'dashboard', icon:'bi-speedometer2', label:'Dashboard' },
    { id:'products',  icon:'bi-box-seam',     label:'Products'  },
    { id:'archive',   icon:'bi-archive',      label:'Archive'   },
    { id:'settings',  icon:'bi-person-circle',label:'Settings'  },
  ];
  return (
    <div style={{ width:200, flexShrink:0, background:WH, borderRight:`1px solid ${BD}`, display:'flex', flexDirection:'column', height:'100%' }}>
      <div style={{ padding:'14px 16px', borderBottom:`1px solid oklch(0.93 0.006 75)` }}>
        <img src="../assets/header.png" alt="Proviant" style={{ height:32, objectFit:'contain' }} />
      </div>
      <div style={{ flex:1, padding:'8px 8px' }}>
        {items.map(item => (
          <div key={item.id} style={{
            display:'flex', alignItems:'center', gap:9, padding:'8px 10px', borderRadius:7, marginBottom:2, cursor:'pointer',
            background: active===item.id ? AS : 'transparent',
            color: active===item.id ? A : F2,
            fontWeight: active===item.id ? 600 : 400, fontSize:13,
          }}>
            <i className={`bi ${item.icon}`} style={{ fontSize:16 }} />
            {item.label}
          </div>
        ))}
      </div>
    </div>
  );
}

function ProductRow({ p }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 16px', borderBottom:`1px solid ${BD}` }}>
      <div style={{ width:36, height:36, borderRadius:8, background:AS, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <i className="bi bi-box-seam" style={{ color:A, fontSize:15 }} />
      </div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:13, fontWeight:600, color:FG, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
        <div style={{ fontSize:11, color:F3 }}>{p.cat}</div>
      </div>
      <span style={{ fontSize:10, fontWeight:600, padding:'2px 8px', borderRadius:999, background:`${p.color}22`, color:p.color, border:`1px solid ${p.color}55`, whiteSpace:'nowrap' }}>{p.label}</span>
    </div>
  );
}

function BarcodeInput({ large, onScan, placeholder='Scan or type barcode…' }) {
  const [val, setVal] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const ref = React.useRef();
  React.useEffect(() => { if (ref.current) ref.current.focus(); }, []);

  const handleKey = (e) => {
    if (e.key === 'Enter' && val.length >= 8) onScan(val);
  };

  return (
    <div style={{ position:'relative', display:'flex', alignItems:'center', background:WH, border:`${focused ? 2 : 1}px solid ${focused ? A : BD}`, borderRadius:10, boxShadow: focused ? `0 0 0 3px oklch(0.50 0.12 162 / 0.15)` : 'none', padding: large ? '14px 16px' : '10px 14px', gap:10, transition:'all 150ms', cursor:'text' }}
      onClick={() => ref.current?.focus()}>
      <i className="bi bi-upc-scan" style={{ fontSize: large ? 22 : 18, color: focused ? A : F3, flexShrink:0, transition:'color 150ms' }} />
      <input ref={ref} value={val} onChange={e => setVal(e.target.value)} onKeyDown={handleKey}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        placeholder={placeholder}
        style={{ border:'none', outline:'none', fontFamily:'var(--font-mono)', fontSize: large ? 16 : 14, color:FG, background:'transparent', width:'100%', letterSpacing:'0.04em' }} />
      {val.length > 0 && (
        <button onClick={() => setVal('')} style={{ background:'none', border:'none', cursor:'pointer', color:F3, fontSize:16, padding:'0 2px', flexShrink:0, display:'flex', alignItems:'center' }}>
          <i className="bi bi-x" />
        </button>
      )}
      {val.length === 0 && (
        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:F3, whiteSpace:'nowrap', flexShrink:0 }}>Press ↵</div>
      )}
    </div>
  );
}

function ScanResult({ name, barcode }) {
  return (
    <div className="fade-in" style={{ background:AS, border:`1px solid oklch(0.78 0.08 162)`, borderRadius:10, padding:'12px 14px', display:'flex', alignItems:'center', gap:10, animation:'slideIn 200ms ease-out' }}>
      <i className="bi bi-check-circle-fill" style={{ color:A, fontSize:16, flexShrink:0 }} />
      <div>
        <div style={{ fontSize:13, fontWeight:600, color:FG }}>{name}</div>
        <div style={{ fontSize:11, color:F3, fontFamily:'var(--font-mono)' }}>{barcode} · Open Food Facts</div>
      </div>
    </div>
  );
}

function ProductForm({ name, onSubmit }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
      <div>
        <div style={{ fontSize:12, fontWeight:500, color:FG, marginBottom:5 }}>Product name <span style={{ color:'oklch(0.55 0.20 25)' }}>*</span></div>
        <input value={name} readOnly style={{ fontFamily:'var(--font-ui)', fontSize:14, color:FG, background:WH, border:`1px solid ${BD}`, borderRadius:8, padding:'9px 12px', width:'100%', outline:'none' }} />
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
        <div>
          <div style={{ fontSize:12, fontWeight:500, color:FG, marginBottom:5 }}>Category</div>
          <select style={{ fontFamily:'var(--font-ui)', fontSize:14, color:FG, background:WH, border:`1px solid ${BD}`, borderRadius:8, padding:'9px 12px', width:'100%', outline:'none', appearance:'none' }}>
            <option>Beverages</option><option>Dairy</option><option>Produce</option><option>Pantry</option>
          </select>
        </div>
        <div>
          <div style={{ fontSize:12, fontWeight:500, color:FG, marginBottom:5 }}>Barcode</div>
          <input readOnly value="5060062997811" style={{ fontFamily:'var(--font-mono)', fontSize:13, color:F2, background:BS, border:`1px solid ${BD}`, borderRadius:8, padding:'9px 12px', width:'100%', outline:'none' }} />
        </div>
      </div>
      <div>
        <div style={{ fontSize:12, fontWeight:500, color:FG, marginBottom:5 }}>Expiry date</div>
        <div style={{ display:'grid', gridTemplateColumns:'60px 60px 80px', gap:8 }}>
          {['DD','MM','YYYY'].map(ph => (
            <input key={ph} placeholder={ph} style={{ fontFamily:'var(--font-mono)', fontSize:13, color:FG, background:WH, border:`1px solid ${BD}`, borderRadius:8, padding:'9px 10px', outline:'none', textAlign:'center' }} />
          ))}
        </div>
        <div style={{ fontSize:11, color:F3, marginTop:4 }}>Leave blank if unknown</div>
      </div>
      <button onClick={onSubmit} style={{ background:A, color:WH, border:'none', borderRadius:9, padding:'12px', fontFamily:'var(--font-ui)', fontSize:14, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8, transition:'background 150ms' }}>
        <i className="bi bi-plus-lg" /> Add to pantry
      </button>
    </div>
  );
}

function SuccessBanner({ name, onAnother }) {
  return (
    <div style={{ background:AS, border:`1px solid oklch(0.78 0.08 162)`, borderRadius:12, padding:'16px 18px', display:'flex', alignItems:'center', gap:14, animation:'slideIn 250ms ease-out' }}>
      <div style={{ width:40, height:40, borderRadius:999, background:'oklch(0.40 0.10 162)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <i className="bi bi-check-lg" style={{ color:WH, fontSize:20 }} />
      </div>
      <div style={{ flex:1 }}>
        <div style={{ fontSize:14, fontWeight:600, color:FG }}>{name} added</div>
        <div style={{ fontSize:12, color:F3 }}>Successfully added to your pantry</div>
      </div>
      <button onClick={onAnother} style={{ background:A, color:WH, border:'none', borderRadius:8, padding:'8px 14px', fontFamily:'var(--font-ui)', fontSize:12, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap' }}>
        <i className="bi bi-plus-lg" /> Add another
      </button>
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   VARIANT 1: Modal dialog
───────────────────────────────────────────────────── */
function Variant1() {
  const [modal, setModal]   = React.useState(true);
  const [step, setStep]     = React.useState('scan'); // scan | form | success

  const handleScan = () => setStep('form');
  const handleSubmit = () => setStep('success');
  const handleReset = () => { setStep('scan'); };

  return (
    <div style={{ display:'flex', height:'100%', background:BG, position:'relative' }}>
      <Sidebar active="products" />
      <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
        {/* Page header */}
        <div style={{ background:WH, borderBottom:`1px solid ${BD}`, padding:'14px 24px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontSize:18, fontWeight:700, color:FG, letterSpacing:'-0.02em' }}>Products</div>
            <div style={{ fontSize:12, color:F3 }}>6 items</div>
          </div>
          <button onClick={() => { setModal(true); setStep('scan'); }} style={{ background:A, color:WH, border:'none', borderRadius:9, padding:'9px 16px', fontFamily:'var(--font-ui)', fontSize:13, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:7, boxShadow:`0 4px 12px ${A}44` }}>
            <i className="bi bi-plus-lg" /> Add product
          </button>
        </div>
        <div style={{ flex:1, overflowY:'auto' }}>
          {PRODUCTS.map(p => <ProductRow key={p.name} p={p} />)}
        </div>
      </div>

      {/* Modal overlay */}
      {modal && (
        <div style={{ position:'absolute', inset:0, background:'oklch(0.18 0.022 70 / 0.4)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:50, animation:'fadeIn 180ms ease-out' }}>
          <div style={{ background:WH, borderRadius:14, boxShadow:'0 20px 60px oklch(0.18 0.022 70 / 0.22)', width:460, overflow:'hidden', animation:'slideIn 250ms cubic-bezier(0.16,1,0.3,1)' }}>
            {/* Modal header */}
            <div style={{ padding:'18px 20px 14px', borderBottom:`1px solid ${BD}`, display:'flex', alignItems:'center', gap:12 }}>
              <div style={{ width:38, height:38, borderRadius:9, background:AS, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, color:A, flexShrink:0 }}>
                <i className="bi bi-upc-scan" />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:15, fontWeight:700, color:FG }}>Add product</div>
                <div style={{ fontSize:12, color:F3 }}>Scan barcode or enter manually</div>
              </div>
              <button onClick={() => setModal(false)} style={{ background:'none', border:'none', cursor:'pointer', color:F3, fontSize:20, display:'flex', padding:4 }}>
                <i className="bi bi-x" />
              </button>
            </div>

            {/* Modal body */}
            <div style={{ padding:'18px 20px 20px', display:'flex', flexDirection:'column', gap:14 }}>
              {step === 'scan' && <>
                <div style={{ fontSize:12, fontWeight:600, color:F3, textTransform:'uppercase', letterSpacing:'0.06em' }}>Barcode</div>
                <BarcodeInput large onScan={handleScan} placeholder="Scan or type EAN barcode…" />
                <div style={{ fontSize:12, color:F3, display:'flex', alignItems:'center', gap:8 }}>
                  <i className="bi bi-keyboard" /> USB/BT scanner — just start scanning, input auto-captures
                </div>
              </>}
              {step === 'form' && <>
                <ScanResult name="Oat Milk Original" barcode="5060062997811" />
                <ProductForm name="Oat Milk Original" onSubmit={handleSubmit} />
              </>}
              {step === 'success' && <>
                <SuccessBanner name="Oat Milk Original" onAnother={handleReset} />
                <button onClick={() => setModal(false)} style={{ background:'transparent', border:`1px solid ${BD}`, borderRadius:9, padding:'10px', fontFamily:'var(--font-ui)', fontSize:13, color:F2, cursor:'pointer' }}>
                  Close
                </button>
              </>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   VARIANT 2: Dedicated page (improved)
───────────────────────────────────────────────────── */
function Variant2() {
  const [step, setStep] = React.useState('scan');

  return (
    <div style={{ display:'flex', height:'100%', background:BG }}>
      <Sidebar active="products" />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflowY:'auto' }}>
        {/* Breadcrumb topbar */}
        <div style={{ background:WH, borderBottom:`1px solid ${BD}`, padding:'12px 28px', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13, color:F3, cursor:'pointer' }}>Products</span>
          <i className="bi bi-chevron-right" style={{ fontSize:10, color:F3 }} />
          <span style={{ fontSize:13, fontWeight:600, color:FG }}>Add product</span>
        </div>

        <div style={{ padding:'32px 28px', maxWidth:640 }}>
          {/* Keyboard hint banner */}
          <div style={{ background:AS, border:`1px solid oklch(0.78 0.08 162)`, borderRadius:10, padding:'12px 16px', display:'flex', alignItems:'center', gap:10, marginBottom:24 }}>
            <i className="bi bi-keyboard" style={{ color:A, fontSize:16 }} />
            <div style={{ fontSize:13, color:FG }}>
              <strong>Scanner ready</strong> — input is auto-focused. Scan any barcode to begin.
            </div>
          </div>

          {step === 'scan' && <>
            <div style={{ marginBottom:10 }}>
              <div style={{ fontSize:22, fontWeight:700, color:FG, letterSpacing:'-0.02em', marginBottom:4 }}>Add product</div>
              <div style={{ fontSize:13, color:F2 }}>Scan a barcode with your USB/BT scanner, or type it manually.</div>
            </div>
            {/* Giant barcode input */}
            <div style={{ position:'relative', background:WH, border:`2px solid ${A}`, borderRadius:12, padding:'18px 20px', display:'flex', alignItems:'center', gap:14, boxShadow:`0 0 0 4px oklch(0.50 0.12 162 / 0.12)`, marginBottom:16 }}>
              <i className="bi bi-upc-scan" style={{ fontSize:28, color:A, flexShrink:0 }} />
              <input autoFocus placeholder="Scan or type EAN barcode…"
                style={{ border:'none', outline:'none', fontFamily:'var(--font-mono)', fontSize:20, color:FG, background:'transparent', width:'100%', letterSpacing:'0.06em' }} />
              <div style={{ fontFamily:'var(--font-mono)', fontSize:12, color:F3, flexShrink:0, background:BS, borderRadius:6, padding:'4px 8px' }}>↵ Enter</div>
            </div>

            {/* Recent scans */}
            <div style={{ marginTop:24 }}>
              <div style={{ fontSize:11, fontWeight:600, color:F3, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 }}>Recently added</div>
              <div style={{ background:WH, border:`1px solid ${BD}`, borderRadius:10, overflow:'hidden' }}>
                {PRODUCTS.slice(0,3).map(p => <ProductRow key={p.name} p={p} />)}
              </div>
            </div>
          </>}

          {step === 'form' && <>
            <div style={{ marginBottom:16 }}>
              <button onClick={() => setStep('scan')} style={{ background:'none', border:'none', cursor:'pointer', color:F2, fontSize:13, display:'flex', alignItems:'center', gap:6, padding:'0 0 12px', fontFamily:'var(--font-ui)' }}>
                <i className="bi bi-arrow-left" /> Back to scan
              </button>
              <div style={{ fontSize:22, fontWeight:700, color:FG, letterSpacing:'-0.02em', marginBottom:4 }}>Confirm details</div>
            </div>
            <ScanResult name="Oat Milk Original" barcode="5060062997811" />
            <div style={{ marginTop:16 }}>
              <ProductForm name="Oat Milk Original" onSubmit={() => setStep('success')} />
            </div>
          </>}

          {step === 'success' && <>
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:22, fontWeight:700, color:FG, letterSpacing:'-0.02em', marginBottom:4 }}>Product added</div>
            </div>
            <SuccessBanner name="Oat Milk Original" onAnother={() => setStep('scan')} />
            <div style={{ marginTop:24, background:WH, border:`1px solid ${BD}`, borderRadius:10, overflow:'hidden' }}>
              <div style={{ padding:'10px 16px 6px', fontSize:11, fontWeight:600, color:F3, textTransform:'uppercase', letterSpacing:'0.06em' }}>Your products</div>
              {PRODUCTS.slice(0,3).map(p => <ProductRow key={p.name} p={p} />)}
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   VARIANT 3: Split view (persistent panel)
───────────────────────────────────────────────────── */
function Variant3() {
  const [step, setStep]   = React.useState('scan');
  const [open, setOpen]   = React.useState(true);

  return (
    <div style={{ display:'flex', height:'100%', background:BG }}>
      <Sidebar active="products" />
      <div style={{ flex:1, display:'flex', overflow:'hidden' }}>
        {/* Left: product list */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', borderRight: open ? `1px solid ${BD}` : 'none' }}>
          <div style={{ background:WH, borderBottom:`1px solid ${BD}`, padding:'14px 18px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div>
              <div style={{ fontSize:16, fontWeight:700, color:FG, letterSpacing:'-0.02em' }}>Products</div>
              <div style={{ fontSize:11, color:F3 }}>6 items</div>
            </div>
            <button onClick={() => { setOpen(true); setStep('scan'); }} style={{ background: open ? AS : A, color: open ? A : WH, border:`1px solid ${open ? 'oklch(0.78 0.08 162)' : 'transparent'}`, borderRadius:9, padding:'8px 14px', fontFamily:'var(--font-ui)', fontSize:12, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:6, transition:'all 150ms' }}>
              <i className="bi bi-plus-lg" /> {open ? 'Adding…' : 'Add product'}
            </button>
          </div>
          {/* Search */}
          <div style={{ padding:'10px 16px', background:WH, borderBottom:`1px solid ${BD}` }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, background:BS, borderRadius:8, padding:'8px 12px' }}>
              <i className="bi bi-search" style={{ fontSize:13, color:F3 }} />
              <input placeholder="Search products…" style={{ border:'none', outline:'none', background:'transparent', fontFamily:'var(--font-ui)', fontSize:13, color:FG, width:'100%' }} />
            </div>
          </div>
          <div style={{ flex:1, overflowY:'auto' }}>
            {PRODUCTS.map(p => <ProductRow key={p.name} p={p} />)}
          </div>
        </div>

        {/* Right: persistent add panel */}
        {open && (
          <div style={{ width:340, flexShrink:0, background:WH, display:'flex', flexDirection:'column', animation:'slideRight 250ms cubic-bezier(0.16,1,0.3,1)', overflowY:'auto' }}>
            {/* Panel header */}
            <div style={{ padding:'14px 18px 12px', borderBottom:`1px solid ${BD}`, display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
              <div style={{ width:34, height:34, borderRadius:8, background:AS, display:'flex', alignItems:'center', justifyContent:'center', fontSize:17, color:A }}>
                <i className="bi bi-upc-scan" />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:700, color:FG }}>Add product</div>
                <div style={{ fontSize:11, color:F3 }}>Scanner ready</div>
              </div>
              <button onClick={() => setOpen(false)} style={{ background:'none', border:'none', cursor:'pointer', color:F3, fontSize:18, display:'flex' }}>
                <i className="bi bi-x" />
              </button>
            </div>

            <div style={{ padding:'16px 18px', flex:1, display:'flex', flexDirection:'column', gap:14 }}>
              {step === 'scan' && <>
                {/* Scanner ready indicator */}
                <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, color:F3 }}>
                  <div style={{ width:8, height:8, borderRadius:999, background:'oklch(0.50 0.12 162)', animation:'scanFlash 1.5s ease-in-out infinite' }} />
                  Waiting for scan — just trigger your scanner
                </div>
                <BarcodeInput onScan={() => setStep('form')} placeholder="Scan or type barcode…" />
                <div style={{ borderTop:`1px solid ${BD}`, paddingTop:14 }}>
                  <div style={{ fontSize:11, fontWeight:600, color:F3, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 }}>Recent</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                    {PRODUCTS.slice(0,3).map(p => (
                      <div key={p.name} style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', borderRadius:8, background:BS, cursor:'pointer' }}>
                        <div style={{ flex:1, fontSize:12, fontWeight:600, color:FG, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
                        <span style={{ fontSize:10, fontWeight:600, padding:'1px 6px', borderRadius:999, background:`${p.color}22`, color:p.color, border:`1px solid ${p.color}55` }}>{p.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </>}

              {step === 'form' && <>
                <ScanResult name="Oat Milk Original" barcode="5060062997811" />
                <ProductForm name="Oat Milk Original" onSubmit={() => setStep('success')} />
              </>}

              {step === 'success' && <>
                <SuccessBanner name="Oat Milk Original" onAnother={() => setStep('scan')} />
                <div style={{ padding:'16px 0', borderTop:`1px solid ${BD}` }}>
                  <div style={{ fontSize:11, fontWeight:600, color:F3, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 }}>Continue scanning</div>
                  <BarcodeInput onScan={() => setStep('form')} placeholder="Scan next product…" />
                </div>
              </>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── MAIN ── */
const VARIANTS = [
  { num:'1', title:'Modal dialog',       rec:false, why:'Triggered from a topbar button. Keyboard auto-focused on open. Best for occasional add — keeps products page clean.' },
  { num:'2', title:'Dedicated page',     rec:false, why:'Full-page layout with a giant barcode input. Clear scanner-ready hint. Best for workflows where adding is a deliberate single action.' },
  { num:'3', title:'Split view panel',   rec:true,  why:'Persistent panel slides in alongside product list. Scanner stays active between adds. Best for bulk scanning sessions — most efficient keyboard/USB scanner UX.' },
];

function App() {
  const [active, setActive] = React.useState('1');
  const v = VARIANTS.find(v => v.num === active);
  const W = 1000, H = 580;

  const screens = { '1':<Variant1/>, '2':<Variant2/>, '3':<Variant3/> };

  return (
    <div style={{ minHeight:'100vh', background:'oklch(0.12 0.01 70)', padding:'36px 32px 56px', display:'flex', flexDirection:'column', alignItems:'center', gap:28 }}>
      {/* Header */}
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.10em', textTransform:'uppercase', color:'oklch(0.50 0.02 70)', marginBottom:6 }}>Proviant · Desktop</div>
        <div style={{ fontSize:26, fontWeight:700, color:'white', letterSpacing:'-0.02em', marginBottom:4 }}>Add product — desktop layouts</div>
        <div style={{ fontSize:13, color:'oklch(0.55 0.02 70)' }}>Keyboard/USB scanner first · click the variant tabs to switch · all interactions are live</div>
      </div>

      {/* Variant tabs */}
      <div style={{ display:'flex', gap:6, background:'oklch(0.18 0.01 70)', borderRadius:10, padding:4 }}>
        {VARIANTS.map(v => (
          <button key={v.num} onClick={() => setActive(v.num)} style={{ padding:'8px 20px', borderRadius:7, border:'none', cursor:'pointer', fontFamily:'var(--font-ui)', fontSize:13, fontWeight: active===v.num ? 600 : 400, background: active===v.num ? 'white' : 'transparent', color: active===v.num ? FG : 'oklch(0.65 0.01 70)', boxShadow: active===v.num ? '0 1px 4px oklch(0 0 0 / 0.12)' : 'none', transition:'all 150ms', display:'flex', alignItems:'center', gap:6 }}>
            {v.rec && <span style={{ fontSize:9, fontWeight:700, background:'oklch(0.50 0.12 162)', color:'white', padding:'1px 6px', borderRadius:99, letterSpacing:'0.04em' }}>REC</span>}
            {v.num} · {v.title}
          </button>
        ))}
      </div>

      {/* Browser window */}
      <div style={{ transform:'scale(0.88)', transformOrigin:'top center', width:W, height:H }}>
        <ChromeWindow width={W} height={H} tabs={[{ title:'Proviant — ' + v.title }]} url="app.proviant.local/products">
          {screens[active]}
        </ChromeWindow>
      </div>
      <div style={{ marginTop: H * 0.88 - H - 8 }} />

      {/* Notes */}
      <div style={{ background:'oklch(0.18 0.01 70)', borderRadius:12, padding:'16px 20px', maxWidth:720, width:'100%' }}>
        <div style={{ fontSize:11, fontWeight:700, color:'oklch(0.55 0.02 70)', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8 }}>Why {v.title}</div>
        <div style={{ fontSize:13, color:'oklch(0.72 0.01 70)', lineHeight:1.65 }}>{v.why}</div>
        {v.rec && <div style={{ marginTop:10, fontSize:12, color:'oklch(0.50 0.12 162)', fontWeight:600 }}>★ Recommended for keyboard/USB scanner workflows</div>}
      </div>

      {/* Keyboard tip */}
      <div style={{ background:'oklch(0.16 0.01 70)', border:'1px solid oklch(0.26 0.01 70)', borderRadius:10, padding:'12px 18px', maxWidth:720, width:'100%', display:'flex', alignItems:'flex-start', gap:12 }}>
        <i className="bi bi-keyboard" style={{ color:'oklch(0.50 0.12 162)', fontSize:18, marginTop:1, flexShrink:0 }} />
        <div style={{ fontSize:12, color:'oklch(0.65 0.01 70)', lineHeight:1.65 }}>
          <strong style={{ color:'white' }}>USB/BT scanner implementation note:</strong> USB barcode scanners emulate keyboard input. The barcode input field must be auto-focused when the add UI opens. Detect scanner input vs manual typing by measuring input speed — if ≥8 chars arrive within 100ms, treat it as a scanner event and auto-submit. This avoids needing a separate "scan" trigger button on desktop.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
