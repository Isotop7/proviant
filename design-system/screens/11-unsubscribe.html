<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — Proviant</title>
  <link rel="stylesheet" href="../../src/assets/css/main.css">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: var(--font-body); font-size: 16px; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; line-height: var(--leading-body); display: flex; align-items: center; justify-content: center; padding: var(--space-6); }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-body); font-weight: 600; border: none; cursor: pointer; border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.04em; transition: all var(--motion-base); white-space: nowrap; text-decoration: none; }
.btn-primary { background: var(--accent); color: #fff !important; padding: 0 var(--space-5); height: 44px; font-size: var(--text-sm); width: 100%; }
  .btn-primary:hover { background: var(--accent-hover); color: #fff !important; }
  .btn-primary:active { background: var(--accent-active); color: #fff !important; }
  .btn-secondary { background: var(--surface-warm); color: var(--fg); padding: 0 var(--space-5); height: 44px; font-size: var(--text-sm); width: 100%; border: 1.5px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--surface-warm); }

  main { width: 100%; max-width: 420px; }
  .card { background: var(--bg); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; }
  .card-body { padding: var(--space-12) var(--space-8); text-align: center; }

  .icon-success { width: 56px; height: 56px; background: oklch(0.90 .06 155 / 0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-5); }
  .icon-success i { font-size: 28px; color: var(--accent); }
  .icon-error { width: 56px; height: 56px; background: oklch(0.93 0.08 25 / 0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-5); }
  .icon-error i { font-size: 28px; color: var(--status-expired); }

  h1 { font-size: var(--text-h2); font-weight: 700; color: var(--fg); margin-bottom: var(--space-3); }
  p { color: var(--fg-2); font-size: var(--text-sm); }
  .small-text { font-size: var(--text-xs); color: var(--fg-2); margin-top: var(--space-3); }
  .mt-3 { margin-top: var(--space-4); }
  .mb-3 { margin-bottom: var(--space-4); }
  .mb-4 { margin-bottom: var(--space-5); }
</style>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../tokens.dark.css">
<style>
/* Icon status panels are hardcoded light tints; tokens.dark.css covers .card only. */
[data-theme="dark"] .icon-success { background: oklch(28% .06 155deg); }
[data-theme="dark"] .icon-error { background: oklch(30% .06 25deg); }
</style>
<script>
(function(){try{var k='proviant_theme',s=localStorage.getItem(k)||'system',e=s==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;document.documentElement.setAttribute('data-theme',e);document.documentElement.setAttribute('data-bs-theme',e);}catch(e){}})();
</script>
</head>
<body>

<main>
  <div class="card">
    <div class="card-body">
      <div class="icon-success"><i class="bi bi-check-circle-fill"></i></div>
      <h1>Unsubscribed</h1>
      <p>You have been successfully unsubscribed from expiry digest emails for <strong>Chen Family</strong>.</p>
      <p class="small-text">You can resubscribe anytime in your notification settings.</p>
      <a href="02-dashboard.html" class="btn btn-primary mt-3">Go to Home</a>
    </div>
  </div>
</main>


<script>
(function(){
  var STORAGE_KEY='proviant_theme';
  var THEMES=['light','dark','system'];
  function system(){return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  function stored(){try{return localStorage.getItem(STORAGE_KEY)||'system';}catch(_){return 'system';}}
  function icon(t){return t==='dark'?'bi-moon-fill':t==='light'?'bi-sun-fill':'bi-circle-half';}
  function apply(t){var e=t==='system'?system():t;document.documentElement.setAttribute('data-theme',e);document.documentElement.setAttribute('data-bs-theme',e);document.querySelectorAll('.js-theme-toggle i').forEach(function(el){el.className='bi '+icon(t);});}
  apply(stored());
  document.addEventListener('DOMContentLoaded',function(){apply(stored());});
  document.addEventListener('click',function(e){if(!e.target.closest('.js-theme-toggle'))return;var c=stored();var n=THEMES[(THEMES.indexOf(c)+1)%THEMES.length];try{localStorage.setItem(STORAGE_KEY,n);}catch(_){}apply(n);});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(stored()==='system')apply('system');});
})();
</script>
</body>
</html>
