<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Proviant</title>
  <link rel="stylesheet" href="../../src/assets/css/main.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: var(--font-body); font-size: 16px; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; line-height: 1.5; display: flex; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); text-decoration: none; }
  ::selection { background: var(--accent-soft); color: var(--accent-on); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-body); font-weight: 600; border: none; cursor: pointer; border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.04em; transition: all var(--motion-base); white-space: nowrap; text-decoration: none; }
  .btn-primary { background: var(--accent); color: var(--accent-on); padding: 0 var(--space-5); height: 44px; font-size: var(--text-sm); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-secondary { background: var(--bg); color: var(--fg); padding: 0 var(--space-5); height: 44px; font-size: var(--text-sm); border: 1.5px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--surface-warm); border-color: var(--muted); }

  .input { width: 100%; height: 44px; padding: 0 var(--space-4); font-family: var(--font-body); font-size: var(--text-base); color: var(--fg); background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); transition: all var(--motion-base); }
  .input::placeholder { color: var(--muted); }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input-label { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--fg-2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: var(--space-2); }

  .divider { height: 1px; background: var(--border); }

  @media (max-width: 768px) {
    .auth-split { flex-direction: column-reverse !important; }
    .auth-art { display: none !important; }
  }

  /* Dot-matrix motif (nothing-design): structure as ornament on warm paper. */
  .dot-grid { position: absolute; inset: 0; background-image: radial-gradient(circle, oklch(30% .03 75deg / .16) 1px, transparent 1px); background-size: 16px 16px; }
</style>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../tokens.dark.css">
<style>
/* Dot-matrix motif (nothing-design) replaces the old diagonal texture;
   tokens.dark.css's inline-style selector no longer matches, so dark is handled here. */
[data-theme="dark"] .dot-grid { background-image: radial-gradient(circle, oklch(92% .008 145deg / .10) 1px, transparent 1px); }
</style>
<script>
(function(){try{var k='proviant_theme',s=localStorage.getItem(k)||'system',e=s==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;document.documentElement.setAttribute('data-theme',e);document.documentElement.setAttribute('data-bs-theme',e);}catch(e){}})();
</script>
</head>
<body>

<div class="auth-split" style="display:flex;flex:1;min-height:100vh">
  <!-- Reset password form panel — LEFT -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative">
    <div class="dot-grid" aria-hidden="true"></div>
    <div style="position:relative;z-index:1;width:100%;max-width:400px;padding:var(--space-8)">
      <div style="margin-bottom:var(--space-8)">
        <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)">
          <div style="width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center">
            <span style="font-size:22px;font-weight:700;color:white;letter-spacing:-0.5px;font-family:'Jost',sans-serif">P</span>
          </div>
          <span style="font-size:var(--text-h3);font-weight:700;color:var(--fg);letter-spacing:-0.02em;font-family:'Jost',sans-serif">proviant</span>
        </div>
        <h2 style="font-size:var(--text-h1);font-weight:700;letter-spacing:-0.02em;color:var(--fg);margin-bottom:var(--space-2)">Set a new password</h2>
        <p style="color:var(--fg-2);font-size:var(--text-sm)">Choose a new password for your account.</p>
      </div>

      <form id="resetPasswordForm" style="display:flex;flex-direction:column;gap:var(--space-5)" novalidate>
        <input type="hidden" id="reset-token" name="token" value="demo-token-abc123">

        <div>
          <label class="input-label" for="new-password">New password</label>
          <div style="position:relative">
            <input class="input" type="password" id="new-password" name="password" placeholder="At least 12 characters" autocomplete="new-password" required minlength="12" style="padding-right:44px" aria-describedby="new-password-error">
            <button type="button" aria-label="Show password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)">
              <i class="bi bi-eye" style="font-size:16px"></i>
            </button>
          </div>
          <div id="new-password-error" style="font-size:var(--text-xs);color:var(--danger);margin-top:6px;display:none"></div>
        </div>

        <div>
          <label class="input-label" for="confirm-password">Confirm new password</label>
          <input class="input" type="password" id="confirm-password" name="passwordConfirm" placeholder="Repeat the new password" autocomplete="new-password" required minlength="12" aria-describedby="confirm-password-error">
          <div id="confirm-password-error" style="font-size:var(--text-xs);color:var(--danger);margin-top:6px;display:none"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="resetSubmitBtn" style="width:100%;margin-top:var(--space-2)">
          <span id="resetSubmitLabel">Reset Password</span>
          <i class="bi bi-check-lg" style="font-size:14px"></i>
        </button>
      </form>

      <div class="divider" style="margin:var(--space-6) 0"></div>

      <p style="text-align:center;font-size:var(--text-sm);color:var(--fg-2)">
        Remembered it? <a href="01-login.html" style="color:var(--accent);font-weight:600">Back to login</a>
      </p>
    </div>
  </div>

  <!-- Brand / art panel — RIGHT -->
  <div class="auth-art" style="width:440px;flex-shrink:0;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-12);position:relative;overflow:hidden">
    <div style="position:absolute;top:-80px;right:-100px;width:340px;height:340px;background:oklch(1 0 0 / 0.07);border-radius:50%"></div>
    <div style="position:absolute;bottom:40px;left:-60px;width:220px;height:220px;background:oklch(1 0 0 / 0.05);border-radius:50%"></div>
    <div style="position:absolute;right:30px;bottom:160px;width:120px;height:120px;background:color-mix(in oklab, #fff 6%, transparent);border-radius:50%"></div>
    <div style="position:relative;z-index:1;text-align:center;max-width:320px">
      <div style="width:72px;height:72px;background:oklch(1 0 0 / 0.2);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-6);backdrop-filter:blur(8px);border:1px solid oklch(1 0 0 / 0.25)">
        <span style="font-size:40px;font-weight:700;color:#fff;letter-spacing:-1px;font-family:'Jost',sans-serif">P</span>
      </div>
      <h1 style="font-size:var(--text-display);font-weight:700;color:#fff;letter-spacing:-0.03em;margin-bottom:var(--space-3)">Secure your account.</h1>
      <p style="font-size:var(--text-base);color:oklch(1 0 0 / 0.72);line-height:1.6">Your password is the key to your household's data. Make it strong and unique.</p>
    </div>
    <div style="position:relative;z-index:1;margin-top:auto;padding-top:var(--space-8)">
      <p style="font-size:var(--text-xs);color:oklch(1 0 0 / 0.45);letter-spacing:0.02em">Proviant — eat better, waste less</p>
    </div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY='proviant_theme';
  var THEMES=['light','dark','system'];
  function system(){return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  function stored(){try{return localStorage.getItem(STORAGE_KEY)||'system';}catch(_){return 'system';}}
  function icon(t){return t==='dark'?'bi-moon-fill':t==='light'?'bi-sun-fill':'bi-circle-half';}
  function apply(t){var e=t==='system'?system():t;document.documentElement.setAttribute('data-theme',e);document.documentElement.setAttribute('data-bs-theme',e);document.querySelectorAll('.js-theme-toggle i').forEach(function(el){el.className='bi '+icon(t);});}
  apply(stored());
  document.addEventListener('DOMContentLoaded',function(){apply(stored());});
  document.addEventListener('click',function(e){if(!e.target.closest('.js-theme-toggle'))return;var c=stored();var n=THEMES[(THEMES.indexOf(c)+1)%THEMES.length];try{localStorage.setItem(STORAGE_KEY,n);}catch(_){}apply(n);});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(stored()==='system')apply('system');});
})();
</script>
</body>
</html>
