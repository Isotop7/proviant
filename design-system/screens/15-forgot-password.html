<!doctype html>
<html lang="en">
<head>
<style>
@font-face {
  font-family: 'Vend Sans';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/vend-sans/files/vend-sans-latin-wght-normal.woff2') format('woff2-variations');
}
@font-face {
  font-family: 'Vend Sans';
  font-style: italic;
  font-weight: 300 700;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/vend-sans/files/vend-sans-latin-wght-italic.woff2') format('woff2-variations');
}

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Proviant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
<style>
  :root {
    /* ── Brand ── */
    --accent:           oklch(42% .14 155deg);
    --accent-fg:        oklch(0% 0 100deg / .9);
    --accent-hover:     oklch(48% .14 155deg);
    --accent-active:    oklch(36% .14 155deg);
    --accent-subtle:    oklch(90% .06 155deg);
    --accent-muted:     oklch(94% .03 155deg);

    /* ── Text ── */
    --fg:               oklch(16% .022 145deg);
    --fg-2:             oklch(42% .018 145deg);
    --fg-3:             oklch(60% .012 145deg);
    --fg-4:             oklch(72% .008 145deg);

    /* ── Backgrounds ── */
    --bg:               oklch(97% .006 145deg);
    --surface: var(--bg);
    --bg-subtle:        oklch(95% .006 145deg);
    --bg-2:             oklch(92% .006 145deg);

    /* ── Borders ── */
    --border:           oklch(87% .008 145deg);
    --border-strong:    oklch(72% .014 145deg);
    --border-subtle:    oklch(93% .005 145deg);

    /* ── Status ── */
    --status-expired:   oklch(55% .20 25deg);
    --status-critical:  oklch(64% .18 45deg);
    --status-soon:     oklch(70% .16 85deg);
    --status-fresh:    oklch(55% .12 150deg);
    --status-nodate:   oklch(60% .010 70deg);

    /* ── Brand palette ── */
    --brand-slate:      oklch(40% .06 240deg);
    --brand-slate-subtle: oklch(96% .006 240deg);
    --color-success:   oklch(60% .14 152deg);
    --color-warning:    oklch(70% .16 85deg);
    --color-danger:     oklch(55% .20 25deg);
    --color-info:       oklch(55% .14 240deg);

    /* ── Typography ── */
    --font-ui:           'Vend Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono:         'DM Mono', ui-monospace, monospace, ui-monospace, monospace;
    --text-xs:          0.6875rem;
    --text-sm:          0.8125rem;
    --text-base:        0.875rem;
    --text-md:          1rem;
    --text-lg:          1.125rem;
    --text-xl:          1.25rem;
    --text-2xl:         1.5rem;
    --text-3xl:         1.875rem;
    --text-4xl:         2.25rem;
    --leading-tight:    1.25;
    --leading-normal:   1.5;
    --leading-relaxed:  1.625;
    --tracking-tight:  -0.025em;
    --tracking-normal:  0;
    --tracking-wide:     0.04em;
    --tracking-wider:    0.06em;

    /* ── Radii ── */
    --radius-pill:      9999px;
    --radius-md:        0.625rem;
    --radius-lg:        1rem;
    --radius-sm:        0.375rem;

    /* ── Shadows ── */
    --shadow-xs:        0 1px 2px oklch(0% 0 0deg / .05);
    --shadow-sm:        0 1px 3px oklch(0% 0 0deg / .08), 0 1px 2px oklch(0% 0 0deg / .04);
    --shadow-md:        0 4px 12px oklch(0% 0 0deg / .10), 0 2px 4px oklch(0% 0 0deg / .06);
    --shadow-lg:        0 12px 32px oklch(0% 0 0deg / .12), 0 4px 8px oklch(0% 0 0deg / .06);

    /* ── Spacing ── */
    --space-1:  0.25rem;
    --space-2:  0.5rem;
    --space-3:  0.75rem;
    --space-4:  1rem;
    --space-5:  1.25rem;
    --space-6:  1.5rem;
    --space-8:  2rem;
    --space-10: 2.5rem;
    --space-12: 3rem;
    --space-16: 4rem;
    --space-20: 5rem;
    --space-24: 6rem;

    /* ── Transitions ── */
    --duration-fast:    100ms;
    --duration-base:    150ms;
    --duration-slow:    300ms;
    --duration-slower:  450ms;
    --ease-bounce:      cubic-bezier(.34, 1.56, .64, 1);
    --ease-in:          cubic-bezier(.4, 0, 1, 1);
    --ease-out:         cubic-bezier(0, 0, .2, 1);
    --ease-in-out:      cubic-bezier(.4, 0, .2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: var(--font-ui); font-size: 16px; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; line-height: var(--leading-normal); display: flex; align-items: center; justify-content: center; padding: var(--space-6); }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-ui); font-weight: 600; border: none; cursor: pointer; border-radius: var(--radius-md); transition: all var(--duration-base); white-space: nowrap; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; padding: 0 var(--space-5); height: 44px; font-size: var(--text-sm); width: 100%; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-primary:active { background: var(--accent-active); transform: translateY(0); }
  .btn-secondary { background: var(--bg-2); color: var(--fg); padding: 0 var(--space-5); height: 44px; font-size: var(--text-sm); width: 100%; border: 1.5px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--bg-subtle); }

  main { width: 100%; max-width: 440px; }
  .card { background: var(--bg); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-md); overflow: hidden; }
  .card-body { padding: var(--space-10) var(--space-8); text-align: center; }

  .brand-logo { display: flex; align-items: center; justify-content: center; gap: var(--space-3); margin-bottom: var(--space-6); }
  .brand-logo-mark { width: 36px; height: 36px; background: var(--accent); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .brand-logo-name { font-size: var(--text-lg); font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }

  .invite-icon { width: 56px; height: 56px; background: var(--accent); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-5); }
  .invite-icon i { font-size: 24px; color: #fff; }

  h3 { font-size: var(--text-xl); font-weight: 700; color: var(--fg); letter-spacing: -0.02em; margin-bottom: var(--space-2); }
  .subtitle { color: var(--fg-2); font-size: var(--text-sm); }

  .alert { padding: var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm); display: flex; align-items: flex-start; gap: var(--space-2); text-align: left; }
  .alert i { flex-shrink: 0; margin-top: 1px; }
  .alert-success { background: oklch(0.90 .06 155 / 0.10); color: oklch(0.36 0.10 155); border: 1px solid oklch(0.90 .06 155 / 0.20); }
  .alert-success i { color: var(--accent); }

  .form-section { display: none; }
  .form-section.active { display: block; }

  .d-grid { display: grid; gap: var(--space-3); margin-top: var(--space-5); text-align: left; }

  .input { width: 100%; height: 44px; padding: 0 var(--space-4); font-family: var(--font-ui); font-size: var(--text-base); color: var(--fg); background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--radius-md); transition: all var(--duration-base); }
  .input::placeholder { color: var(--fg-3); }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); outline: none; }
  .input-label { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--fg-2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: var(--space-2); }
  .field-error { font-size: var(--text-xs); color: var(--color-danger); margin-top: 6px; display: none; }

  .text-center { text-align: center; }
  .mt-3 { margin-top: var(--space-4); }
  .mt-4 { margin-top: var(--space-5); }

  .back-link { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); font-weight: 600; color: var(--accent); margin-top: var(--space-5); }
  .back-link:hover { color: var(--accent-hover); }
</style>
<link rel="stylesheet" href="../tokens.dark.css">
<script>
(function(){try{var k='proviant_theme',s=localStorage.getItem(k)||'system',e=s==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;document.documentElement.setAttribute('data-theme',e);document.documentElement.setAttribute('data-bs-theme',e);}catch(e){}})();
</script>
</head>
<body>

<main>
  <div class="card">
    <div class="card-body">

      <!-- ===================== FORM STATE ===================== -->
      <div class="form-section active" id="page-form">
        <div class="brand-logo">
          <div class="brand-logo-mark">P</div>
          <span class="brand-logo-name">proviant</span>
        </div>
        <h3>Reset your password</h3>
        <p class="subtitle">Enter the email address on your account and we'll send you a reset link.</p>

        <form id="forgotForm" class="d-grid" novalidate>
          <div>
            <label class="input-label" for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required aria-describedby="email-error">
            <div class="field-error" id="email-error"></div>
          </div>
          <button type="submit" class="btn btn-primary" id="forgotBtn">
            <i class="bi bi-envelope" id="forgotBtnIcon" style="font-size:14px"></i>
            <span id="forgotBtnLabel">Send Reset Link</span>
          </button>
        </form>

        <div class="text-center">
          <a href="01-login.html" class="back-link">
            <i class="bi bi-arrow-left"></i>Back to Sign In
          </a>
        </div>
      </div>

      <!-- ===================== SUCCESS STATE ===================== -->
      <div class="form-section" id="page-success">
        <div class="invite-icon"><i class="bi bi-check-lg"></i></div>
        <h3>Check your email</h3>
        <div class="alert alert-success mt-4">
          <i class="bi bi-check-circle"></i>
          <span>If an account with that email address exists, we just sent a reset link.</span>
        </div>
        <div class="text-center mt-4">
          <a href="01-login.html" class="btn btn-primary">Back to Sign In</a>
        </div>
      </div>

    </div>
  </div>
</main>

<script>
document.getElementById('forgotForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email');
  var err = document.getElementById('email-error');
  var btn = document.getElementById('forgotBtn');
  var label = document.getElementById('forgotBtnLabel');
  var icon = document.getElementById('forgotBtnIcon');

  err.style.display = 'none';
  email.style.borderColor = 'var(--border)';

  if (!email.value || !email.value.includes('@')) {
    err.textContent = 'Please enter a valid email address';
    err.style.display = 'block';
    email.style.borderColor = 'var(--color-danger)';
    email.focus();
    return;
  }

  label.textContent = 'Sending...';
  icon.className = 'bi bi-hourglass-split';
  btn.style.opacity = '0.7';
  btn.disabled = true;

  setTimeout(function() {
    document.getElementById('page-form').classList.remove('active');
    var success = document.getElementById('page-success');
    success.classList.add('active');
    success.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 900);
});

// Demo: switch between states by toggling .active on the desired .form-section.
// In production, the server renders the correct state server-side.
</script>

<button id="themeToggleBtn" type="button" aria-label="Toggle theme" style="position:fixed;right:16px;bottom:16px;z-index:1000;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--fg);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;cursor:pointer">
  <i class="bi bi-circle-half" style="font-size:18px"></i>
</button>
<script>
(function(){
  var STORAGE_KEY='proviant_theme';
  var THEMES=['light','dark','system'];
  function system(){return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  function stored(){try{return localStorage.getItem(STORAGE_KEY)||'system';}catch(_){return 'system';}}
  function icon(t){return t==='dark'?'bi-moon-fill':t==='light'?'bi-sun-fill':'bi-circle-half';}
  function apply(t){var e=t==='system'?system():t;document.documentElement.setAttribute('data-theme',e);document.documentElement.setAttribute('data-bs-theme',e);var b=document.getElementById('themeToggleBtn');if(b){b.querySelector('i').className='bi '+icon(t);}}
  apply(stored());
  document.addEventListener('DOMContentLoaded',function(){apply(stored());});
  document.addEventListener('click',function(e){if(!e.target.closest('#themeToggleBtn'))return;var c=stored();var n=THEMES[(THEMES.indexOf(c)+1)%THEMES.length];try{localStorage.setItem(STORAGE_KEY,n);}catch(_){}apply(n);});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(stored()==='system')apply('system');});
})();
</script>
</body>
</html>
