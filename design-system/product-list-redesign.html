<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(0.12 0.01 70); font-family: var(--font-ui); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../../browser-window.jsx"></script>
<script type="text/babel">

/* ── TOKENS ── */
const A  = 'oklch(0.50 0.12 162)';
const AS = 'oklch(0.93 0.04 162)';
const FG = 'oklch(0.18 0.022 70)';
const F2 = 'oklch(0.48 0.018 70)';
const F3 = 'oklch(0.65 0.012 70)';
const BG = 'oklch(0.98 0.012 75)';
const BS = 'oklch(0.96 0.008 75)';
const BD = 'oklch(0.88 0.010 75)';
const WH = '#ffffff';

const STATUS = {
  expired:  { label:'Expired',       icon:'bi-x-circle-fill',          bg:'oklch(0.95 0.05 25)',  fg:'oklch(0.45 0.20 25)',  border:'oklch(0.80 0.12 25)',  bar:'oklch(0.55 0.20 25)',  dot:'oklch(0.55 0.20 25)' },
  critical: { label:'Critical',      icon:'bi-exclamation-circle-fill', bg:'oklch(0.96 0.05 45)',  fg:'oklch(0.50 0.18 45)',  border:'oklch(0.82 0.12 45)',  bar:'oklch(0.64 0.18 45)',  dot:'oklch(0.64 0.18 45)' },
  soon:     { label:'Expiring soon', icon:'bi-clock-fill',              bg:'oklch(0.97 0.05 80)',  fg:'oklch(0.50 0.16 80)',  border:'oklch(0.85 0.10 80)',  bar:'oklch(0.72 0.16 80)',  dot:'oklch(0.72 0.16 80)' },
  fresh:    { label:'Fresh',         icon:'bi-check-circle-fill',       bg:'oklch(0.94 0.04 145)', fg:'oklch(0.38 0.10 145)', border:'oklch(0.78 0.08 145)', bar:'oklch(0.50 0.12 162)', dot:'oklch(0.50 0.12 162)' },
  nodate:   { label:'No date',       icon:'bi-dash-circle-fill',        bg:'oklch(0.94 0.006 70)', fg:'oklch(0.45 0.010 70)', border:'oklch(0.80 0.008 70)', bar:'oklch(0.60 0.010 70)', dot:'oklch(0.60 0.010 70)' },
};

const PRODUCTS = [
  { id:7,  name:'Nutella',                      cat:'Spreads',   loc:'Pantry',  status:'expired',  expiry:'08.04.2026', ago:'Expired 16 days ago',  amount:1 },
  { id:8,  name:'Oreo Original',                cat:'Biscuits',  loc:'Fridge',  status:'expired',  expiry:'13.04.2026', ago:'Expired 11 days ago',  amount:2 },
  { id:9,  name:'Whole Milk',                   cat:'Dairy',     loc:'Fridge',  status:'expired',  expiry:'18.04.2026', ago:'Expired 6 days ago',   amount:1 },
  { id:30, name:'Nutella',                      cat:'Spreads',   loc:'Pantry',  status:'critical', expiry:'25.04.2026', ago:'Expires tomorrow',     amount:1 },
  { id:2,  name:'Prince Goût Chocolat',         cat:'Biscuits',  loc:'Pantry',  status:'critical', expiry:'26.04.2026', ago:'Expires in 2 days',    amount:3 },
  { id:10, name:'Cristalline 1.5L',             cat:'Beverages', loc:'Pantry',  status:'soon',     expiry:'29.04.2026', ago:'Expires in 5 days',    amount:2 },
  { id:11, name:'Greek Yogurt',                 cat:'Dairy',     loc:'Fridge',  status:'soon',     expiry:'01.05.2026', ago:'Expires in 7 days',    amount:1 },
  { id:12, name:'Sourdough Bread',              cat:'Bakery',    loc:'Pantry',  status:'fresh',    expiry:'10.05.2026', ago:'Expires in 16 days',   amount:1 },
  { id:13, name:'Orange Juice',                 cat:'Beverages', loc:'Fridge',  status:'fresh',    expiry:'15.05.2026', ago:'Expires in 21 days',   amount:2 },
  { id:14, name:'Cheddar Cheese',               cat:'Dairy',     loc:'Fridge',  status:'fresh',    expiry:'20.05.2026', ago:'Expires in 26 days',   amount:1 },
  { id:15, name:'Pasta Fusilli 500g',           cat:'Pantry',    loc:'Pantry',  status:'fresh',    expiry:'01.06.2026', ago:'Expires in 38 days',   amount:4 },
  { id:16, name:'Olive Oil Extra Virgin',       cat:'Pantry',    loc:'Pantry',  status:'nodate',   expiry:null,         ago:null,                   amount:1 },
];

/* ── SHARED UI ── */

function Badge({ status, small }) {
  const s = STATUS[status];
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap: small?3:5, background:s.bg, color:s.fg, border:`1px solid ${s.border}`, borderRadius:999, fontWeight:600, fontSize: small?10:11, padding: small?'1px 7px':'3px 10px', whiteSpace:'nowrap' }}>
      <i className={`bi ${s.icon}`} style={{ fontSize: small?10:11 }} />{s.label}
    </span>
  );
}

function Checkbox({ checked, onChange }) {
  return (
    <div onClick={onChange} style={{ width:16, height:16, borderRadius:4, border: checked?'none':`1.5px solid ${BD}`, background: checked?A:WH, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0, boxShadow:'0 1px 2px oklch(0 0 0 / 0.06)' }}>
      {checked && <i className="bi bi-check" style={{ color:WH, fontSize:11 }} />}
    </div>
  );
}

function Toolbar({ search, setSearch, statusFilter, setStatusFilter, locFilter, setLocFilter, selected, onEdit, onArchive, onDelete, viewMode, setViewMode }) {
  const statuses = ['all','expired','critical','soon','fresh','nodate'];
  const locs     = ['All','Fridge','Freezer','Pantry'];

  return (
    <div style={{ background:WH, borderBottom:`1px solid ${BD}`, padding:'10px 16px', display:'flex', flexDirection:'column', gap:8, flexShrink:0 }}>
      {/* Row 1: search + view toggle + add */}
      <div style={{ display:'flex', gap:8, alignItems:'center' }}>
        <div style={{ flex:1, position:'relative' }}>
          <i className="bi bi-search" style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', color:F3, fontSize:14 }} />
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products…"
            style={{ fontFamily:'var(--font-ui)', fontSize:13, color:FG, background:BS, border:`1px solid ${BD}`, borderRadius:8, padding:'8px 12px 8px 32px', width:'100%', outline:'none' }} />
        </div>
        {/* View toggle */}
        <div style={{ display:'flex', gap:2, background:BS, borderRadius:7, padding:2 }}>
          {[['bi-grid-3x3-gap','grid'],['bi-list-ul','list'],['bi-layout-three-columns','grouped']].map(([ic,id]) => (
            <button key={id} onClick={() => setViewMode(id)} style={{ width:30, height:30, borderRadius:5, border:'none', cursor:'pointer', background: viewMode===id ? WH : 'transparent', color: viewMode===id ? FG : F3, display:'flex', alignItems:'center', justifyContent:'center', boxShadow: viewMode===id ? '0 1px 3px oklch(0 0 0 / 0.10)' : 'none', fontSize:14 }}>
              <i className={`bi ${ic}`} />
            </button>
          ))}
        </div>
        <button style={{ background:A, color:WH, border:'none', borderRadius:8, padding:'8px 14px', fontFamily:'var(--font-ui)', fontSize:13, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:6, boxShadow:`0 3px 10px ${A}44` }}>
          <i className="bi bi-plus-lg" style={{ fontSize:14 }} /> Add product
        </button>
      </div>

      {/* Row 2: status filters + loc filters + bulk actions */}
      <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap' }}>
        {/* Status pills */}
        <div style={{ display:'flex', gap:4 }}>
          {statuses.map(s => {
            const st = STATUS[s];
            const active = statusFilter === s;
            return (
              <button key={s} onClick={() => setStatusFilter(s)} style={{
                padding:'4px 10px', borderRadius:999, border: active ? `1.5px solid ${s==='all'?A:st?.border}` : `1px solid ${BD}`,
                background: active ? (s==='all'?AS:st?.bg) : WH,
                color: active ? (s==='all'?A:st?.fg) : F2,
                fontFamily:'var(--font-ui)', fontSize:11, fontWeight: active?600:400, cursor:'pointer', whiteSpace:'nowrap',
                display:'flex', alignItems:'center', gap:4,
              }}>
                {s!=='all' && <div style={{ width:6, height:6, borderRadius:999, background: active?st?.dot:BD }} />}
                {s==='all' ? 'All' : st?.label}
              </button>
            );
          })}
        </div>
        <div style={{ width:1, height:16, background:BD, margin:'0 2px' }} />
        {/* Location pills */}
        {locs.map(l => (
          <button key={l} onClick={() => setLocFilter(l)} style={{
            padding:'4px 10px', borderRadius:999, border: locFilter===l ? `1.5px solid ${A}` : `1px solid ${BD}`,
            background: locFilter===l ? AS : WH, color: locFilter===l ? A : F2,
            fontFamily:'var(--font-ui)', fontSize:11, fontWeight: locFilter===l?600:400, cursor:'pointer',
          }}>{l}</button>
        ))}
        {/* Bulk actions */}
        {selected.length > 0 && (
          <div style={{ marginLeft:'auto', display:'flex', gap:6, alignItems:'center', animation:'fadeIn 150ms ease-out' }}>
            <span style={{ fontSize:11, color:A, fontWeight:600 }}>{selected.length} selected</span>
            <button onClick={onEdit} style={{ background:WH, border:`1px solid ${BD}`, borderRadius:7, padding:'5px 10px', fontFamily:'var(--font-ui)', fontSize:11, cursor:'pointer', display:'flex', alignItems:'center', gap:5, color:F2 }}><i className="bi bi-pencil" />Edit</button>
            <button onClick={onArchive} style={{ background:WH, border:`1px solid ${BD}`, borderRadius:7, padding:'5px 10px', fontFamily:'var(--font-ui)', fontSize:11, cursor:'pointer', display:'flex', alignItems:'center', gap:5, color:F2 }}><i className="bi bi-archive" />Archive</button>
            <button onClick={onDelete} style={{ background:'oklch(0.95 0.05 25)', border:`1px solid oklch(0.80 0.12 25)`, borderRadius:7, padding:'5px 10px', fontFamily:'var(--font-ui)', fontSize:11, cursor:'pointer', display:'flex', alignItems:'center', gap:5, color:'oklch(0.45 0.20 25)' }}><i className="bi bi-trash3" />Delete</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── OPTION A: Compact card grid ── */
function CompactCard({ p, selected, onToggle }) {
  const s = STATUS[p.status];
  const [hov, setHov] = React.useState(false);
  return (
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{
      background:WH, borderRadius:9, border: selected?`1.5px solid ${A}`:`1px solid ${BD}`,
      boxShadow: hov ? '0 4px 12px oklch(0.18 0.02 70 / 0.10)' : '0 1px 3px oklch(0.18 0.02 70 / 0.06)',
      transform: hov ? 'translateY(-1px)' : 'none', transition:'all 200ms ease-out',
      overflow:'hidden', position:'relative',
    }}>
      {/* Status bar */}
      <div style={{ height:3, background:s.bar }} />
      {/* Image thumbnail row */}
      <div style={{ padding:'10px 12px 8px', display:'flex', alignItems:'center', gap:10 }}>
        <div onClick={onToggle} style={{ position:'relative', flexShrink:0 }}>
          <div style={{ width:40, height:40, borderRadius:7, background:BS, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
            <i className="bi bi-box-seam" style={{ fontSize:18, color:F3 }} />
          </div>
          {(hov || selected) && (
            <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:7, background:'oklch(0 0 0 / 0.35)' }}>
              <Checkbox checked={selected} />
            </div>
          )}
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:FG, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
          <div style={{ fontSize:11, color:F3, marginTop:1 }}>{p.cat}{p.loc && p.loc!=='Pantry' ? ` · ${p.loc}` : ''}</div>
        </div>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, fontWeight:700, background:AS, color:A, border:`1px solid oklch(0.78 0.08 162)`, borderRadius:5, padding:'1px 5px', flexShrink:0 }}>#{p.id}</span>
      </div>
      {/* Status + expiry */}
      <div style={{ padding:'0 12px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:6 }}>
        <Badge status={p.status} small />
        {p.ago && <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color: p.status==='expired'?'oklch(0.45 0.20 25)':p.status==='critical'?'oklch(0.50 0.18 45)':F3 }}>{p.ago}</span>}
      </div>
      {/* Amount row */}
      <div style={{ padding:'8px 12px', borderTop:`1px solid oklch(0.93 0.006 75)`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <span style={{ fontSize:11, color:F3 }}>Qty</span>
        <div style={{ display:'flex', alignItems:'center', gap:6, background:BS, borderRadius:6, overflow:'hidden', border:`1px solid ${BD}` }}>
          <button style={{ width:24, height:24, background:'none', border:'none', cursor:'pointer', color:F2, fontSize:14, display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:600, color:FG, minWidth:16, textAlign:'center' }}>{p.amount}</span>
          <button style={{ width:24, height:24, background:'none', border:'none', cursor:'pointer', color:F2, fontSize:14, display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
        </div>
      </div>
    </div>
  );
}

/* ── OPTION B: List/table view ── */
function ListRow({ p, selected, onToggle, even }) {
  const s = STATUS[p.status];
  const [hov, setHov] = React.useState(false);
  return (
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{
      display:'grid', gridTemplateColumns:'32px 1fr 120px 120px 80px 80px', alignItems:'center',
      padding:'9px 16px', gap:10, cursor:'default',
      background: selected?`${A}0a` : hov?`oklch(0.97 0.006 75)`:'transparent',
      borderBottom:`1px solid oklch(0.93 0.006 75)`,
      transition:'background 120ms',
    }}>
      <Checkbox checked={selected} onChange={onToggle} />
      {/* Name + cat */}
      <div style={{ display:'flex', alignItems:'center', gap:10, minWidth:0 }}>
        <div style={{ width:32, height:32, borderRadius:6, background:BS, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', position:'relative' }}>
          <i className="bi bi-box-seam" style={{ fontSize:14, color:F3 }} />
          <div style={{ position:'absolute', bottom:-2, right:-2, width:10, height:10, borderRadius:999, background:s.dot, border:`1.5px solid ${WH}` }} />
        </div>
        <div style={{ minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:FG, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
          <div style={{ fontSize:10, color:F3, fontFamily:'var(--font-mono)' }}>#{p.id} · {p.cat}</div>
        </div>
      </div>
      {/* Status */}
      <div><Badge status={p.status} small /></div>
      {/* Expiry */}
      <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color: p.status==='expired'?'oklch(0.45 0.20 25)':p.status==='critical'?'oklch(0.50 0.18 45)':F2 }}>
        {p.ago || '—'}
      </div>
      {/* Location */}
      <div style={{ fontSize:11, color:F3 }}>{p.loc}</div>
      {/* Amount stepper */}
      <div style={{ display:'flex', alignItems:'center', gap:0, background:WH, borderRadius:6, overflow:'hidden', border:`1px solid ${BD}`, width:'fit-content' }}>
        <button style={{ width:22, height:26, background:BS, border:'none', cursor:'pointer', color:F2, fontSize:13, display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:600, color:FG, width:24, textAlign:'center' }}>{p.amount}</span>
        <button style={{ width:22, height:26, background:BS, border:'none', cursor:'pointer', color:F2, fontSize:13, display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
      </div>
    </div>
  );
}

/* ── OPTION C: Grouped by status ── */
function GroupedView({ products, selected, toggleSelect }) {
  const groups = [
    { key:'expired',  label:'Expired',       urgency:'Requires immediate action' },
    { key:'critical', label:'Critical',       urgency:'Expires within 1–3 days' },
    { key:'soon',     label:'Expiring soon',  urgency:'Expires within 4–7 days' },
    { key:'fresh',    label:'Fresh',          urgency:'More than 7 days remaining' },
    { key:'nodate',   label:'No date',        urgency:'Expiry date unknown' },
  ];
  return (
    <div style={{ padding:'14px 16px', display:'flex', flexDirection:'column', gap:16 }}>
      {groups.map(g => {
        const items = products.filter(p => p.status === g.key);
        if (!items.length) return null;
        const s = STATUS[g.key];
        return (
          <div key={g.key}>
            {/* Group header */}
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
              <div style={{ width:8, height:8, borderRadius:999, background:s.dot, flexShrink:0 }} />
              <div style={{ fontSize:12, fontWeight:700, color:FG }}>{g.label}</div>
              <div style={{ fontSize:11, color:F3 }}>{g.urgency}</div>
              <div style={{ flex:1, height:1, background:BD }} />
              <span style={{ fontFamily:'var(--font-mono)', fontSize:10, color:F3 }}>{items.length} item{items.length!==1?'s':''}</span>
            </div>
            {/* Cards in row */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(200px, 1fr))', gap:10 }}>
              {items.map(p => (
                <div key={p.id} style={{ background:WH, borderRadius:8, border:`1px solid ${BD}`, boxShadow:'0 1px 3px oklch(0.18 0.02 70 / 0.06)', overflow:'hidden' }}>
                  <div style={{ height:2.5, background:s.bar }} />
                  <div style={{ padding:'10px 12px', display:'flex', alignItems:'center', gap:9 }}>
                    <div onClick={() => toggleSelect(p.id)} style={{ width:34, height:34, borderRadius:6, background:BS, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative' }}>
                      {selected.includes(p.id)
                        ? <div style={{ position:'absolute', inset:0, borderRadius:6, background:A, display:'flex', alignItems:'center', justifyContent:'center' }}><i className="bi bi-check" style={{ color:WH, fontSize:13 }} /></div>
                        : <i className="bi bi-box-seam" style={{ fontSize:15, color:F3 }} />
                      }
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:FG, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
                      <div style={{ fontSize:10, color:F3, marginTop:1 }}>{p.cat} · {p.loc}</div>
                      {p.ago && <div style={{ fontFamily:'var(--font-mono)', fontSize:9, color:s.fg, marginTop:3 }}>{p.ago}</div>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── MAIN PROTOTYPE ── */
function ProductList() {
  const [search, setSearch]           = React.useState('');
  const [statusFilter, setStatusFilter] = React.useState('all');
  const [locFilter, setLocFilter]     = React.useState('All');
  const [selected, setSelected]       = React.useState([]);
  const [viewMode, setViewMode]       = React.useState('grid');

  const toggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);

  const filtered = PRODUCTS.filter(p => {
    const matchSearch = !search || p.name.toLowerCase().includes(search.toLowerCase());
    const matchStatus = statusFilter==='all' || p.status===statusFilter;
    const matchLoc    = locFilter==='All' || p.loc===locFilter;
    return matchSearch && matchStatus && matchLoc;
  });

  const expired  = PRODUCTS.filter(p=>p.status==='expired').length;
  const critical = PRODUCTS.filter(p=>p.status==='critical').length;

  return (
    <div style={{ display:'flex', height:'100%', background:BG, fontFamily:'var(--font-ui)', flexDirection:'column' }}>
      {/* Sidebar */}
      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
        <div style={{ width:180, background:WH, borderRight:`1px solid ${BD}`, display:'flex', flexDirection:'column', flexShrink:0 }}>
          <div style={{ padding:'12px 14px', borderBottom:`1px solid oklch(0.93 0.006 75)` }}>
            <img src="../../assets/header.png" alt="Proviant" style={{ height:26, objectFit:'contain' }} />
          </div>
          <div style={{ padding:'6px' }}>
            {[['bi-speedometer2','Dashboard'],['bi-box-seam','Products'],['bi-archive','Archive'],['bi-person-circle','Settings']].map(([ic,lb]) => (
              <div key={lb} style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 9px', borderRadius:6, marginBottom:2, background: lb==='Products'?AS:'transparent', color: lb==='Products'?A:F2, fontWeight: lb==='Products'?600:400, fontSize:12, cursor:'pointer', justifyContent:'space-between' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <i className={`bi ${ic}`} style={{ fontSize:15 }} />{lb}
                </div>
                {lb==='Products' && (expired+critical)>0 && (
                  <span style={{ fontSize:9, fontWeight:700, background:'oklch(0.55 0.20 25)', color:WH, borderRadius:999, padding:'1px 5px', minWidth:16, textAlign:'center' }}>{expired+critical}</span>
                )}
              </div>
            ))}
          </div>
        </div>

        {/* Content */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
          {/* Page header */}
          <div style={{ background:WH, borderBottom:`1px solid ${BD}`, padding:'14px 18px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
            <div>
              <div style={{ fontSize:18, fontWeight:700, color:FG, letterSpacing:'-0.02em' }}>Products</div>
              <div style={{ fontSize:11, color:F3, marginTop:1 }}>21 items in your household</div>
            </div>
            {/* Urgent alert */}
            {(expired+critical)>0 && (
              <div style={{ background:'oklch(0.95 0.05 25)', border:`1px solid oklch(0.80 0.12 25)`, borderRadius:8, padding:'8px 12px', display:'flex', alignItems:'center', gap:8, fontSize:12 }}>
                <i className="bi bi-exclamation-circle-fill" style={{ color:'oklch(0.55 0.20 25)', fontSize:14 }} />
                <span style={{ color:'oklch(0.40 0.18 25)', fontWeight:500 }}>{expired} expired · {critical} critical</span>
                <button onClick={() => setStatusFilter('expired')} style={{ background:'none', border:'none', cursor:'pointer', color:'oklch(0.45 0.20 25)', fontSize:11, fontWeight:600, textDecoration:'underline', padding:0 }}>Show expired</button>
              </div>
            )}
          </div>

          <Toolbar
            search={search} setSearch={setSearch}
            statusFilter={statusFilter} setStatusFilter={setStatusFilter}
            locFilter={locFilter} setLocFilter={setLocFilter}
            selected={selected}
            onEdit={() => {}} onArchive={() => setSelected([])} onDelete={() => setSelected([])}
            viewMode={viewMode} setViewMode={setViewMode}
          />

          {/* Content area */}
          <div style={{ flex:1, overflowY:'auto' }}>
            {viewMode === 'grid' && (
              <div style={{ padding:'14px 16px', display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(210px, 1fr))', gap:12, animation:'fadeIn 150ms ease-out' }}>
                {filtered.map(p => (
                  <CompactCard key={p.id} p={p} selected={selected.includes(p.id)} onToggle={() => toggleSelect(p.id)} />
                ))}
              </div>
            )}

            {viewMode === 'list' && (
              <div style={{ animation:'fadeIn 150ms ease-out' }}>
                {/* Table header */}
                <div style={{ display:'grid', gridTemplateColumns:'32px 1fr 120px 120px 80px 80px', padding:'8px 16px', gap:10, borderBottom:`1px solid ${BD}`, background:BS }}>
                  {['','Product','Status','Expiry','Location','Qty'].map((h,i) => (
                    <div key={i} style={{ fontSize:10, fontWeight:600, color:F3, textTransform:'uppercase', letterSpacing:'0.06em' }}>{h}</div>
                  ))}
                </div>
                {filtered.map((p,i) => <ListRow key={p.id} p={p} selected={selected.includes(p.id)} onToggle={() => toggleSelect(p.id)} even={i%2===0} />)}
              </div>
            )}

            {viewMode === 'grouped' && (
              <div style={{ animation:'fadeIn 150ms ease-out' }}>
                <GroupedView products={filtered} selected={selected} toggleSelect={toggleSelect} />
              </div>
            )}

            {filtered.length === 0 && (
              <div style={{ padding:'48px 24px', textAlign:'center' }}>
                <div style={{ width:48, height:48, background:BS, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 14px', fontSize:22, color:F3 }}>
                  <i className="bi bi-search" />
                </div>
                <div style={{ fontSize:14, fontWeight:600, color:FG, marginBottom:6 }}>No results found</div>
                <div style={{ fontSize:12, color:F2, marginBottom:16 }}>Try adjusting your search or filters</div>
                <button onClick={() => { setSearch(''); setStatusFilter('all'); setLocFilter('All'); }} style={{ background:WH, border:`1px solid ${BD}`, borderRadius:8, padding:'8px 16px', fontFamily:'var(--font-ui)', fontSize:12, cursor:'pointer', color:F2 }}>Clear filters</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const W = 1000, H = 620;
  const SCALE = 0.78;

  return (
    <div style={{ minHeight:'100vh', background:'oklch(0.12 0.01 70)', padding:'36px 32px 56px', display:'flex', flexDirection:'column', alignItems:'center', gap:28 }}>
      {/* Header */}
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.10em', textTransform:'uppercase', color:'oklch(0.50 0.02 70)', marginBottom:6 }}>Proviant · Product List</div>
        <div style={{ fontSize:26, fontWeight:700, color:'white', letterSpacing:'-0.02em', marginBottom:4 }}>Layout redesign</div>
        <div style={{ fontSize:13, color:'oklch(0.55 0.02 70)' }}>Use the three view toggles (⊞ ≡ ⊟) in the toolbar to switch layouts · all interactions are live</div>
      </div>

      {/* Browser frame */}
      <div style={{ transform:`scale(${SCALE})`, transformOrigin:'top center', width:W, height:H }}>
        <ChromeWindow width={W} height={H} tabs={[{ title:'Products — Proviant' }]} url="app.proviant.local/products">
          <ProductList />
        </ChromeWindow>
      </div>
      <div style={{ marginTop: H*SCALE - H - 8 }} />

      {/* Design decision notes */}
      <div style={{ maxWidth:780, width:'100%', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 }}>
        {[
          { icon:'bi-grid-3x3-gap', label:'Grid view', rec:false, points:['Compact cards — 40px thumbnail instead of 200px placeholder','Status bar + badge + relative date in one glance','Qty stepper inline, not dominating','Hover to reveal checkbox — cleaner at rest'] },
          { icon:'bi-list-ul', label:'List view', rec:true, points:['21+ items: list is faster to scan','Status dot on thumbnail — no badge needed','5 data points in one row (name/status/expiry/location/qty)','Column headers for clarity','Best for power users'] },
          { icon:'bi-layout-three-columns', label:'Grouped view', rec:false, points:['Sorted by urgency — expired always first','Group headers with count and urgency label','Badge count in sidebar nav item','Best for daily check workflow'] },
        ].map(v => (
          <div key={v.label} style={{ background:'oklch(0.18 0.01 70)', border:`1px solid ${v.rec?A:'oklch(0.26 0.01 70)'}`, borderRadius:10, padding:'14px 16px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
              <i className={`bi ${v.icon}`} style={{ color: v.rec?A:'oklch(0.55 0.02 70)', fontSize:16 }} />
              <div style={{ fontSize:13, fontWeight:700, color:'white' }}>{v.label}</div>
              {v.rec && <span style={{ fontSize:9, fontWeight:700, background:A, color:'white', borderRadius:99, padding:'1px 7px', letterSpacing:'0.04em', marginLeft:'auto' }}>RECOMMENDED</span>}
            </div>
            <ul style={{ paddingLeft:14, display:'flex', flexDirection:'column', gap:5 }}>
              {v.points.map(p => <li key={p} style={{ fontSize:11, color:'oklch(0.65 0.01 70)', lineHeight:1.5 }}>{p}</li>)}
            </ul>
          </div>
        ))}
      </div>

      {/* Key changes summary */}
      <div style={{ maxWidth:780, width:'100%', background:'oklch(0.16 0.01 70)', border:'1px solid oklch(0.26 0.01 70)', borderRadius:12, padding:'18px 22px' }}>
        <div style={{ fontSize:11, fontWeight:700, color:'oklch(0.55 0.02 70)', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:12 }}>Key changes from current design</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {[
            ['Single search field','Removed the "Product Name" dropdown — one smart search field is faster and less confusing'],
            ['Status filter tabs','Added All/Expired/Critical/Soon/Fresh/No date status filter — more useful than location-only'],
            ['Urgent alert banner','Red banner in page header shows expired + critical count with a quick filter shortcut'],
            ['Nav badge','Sidebar Products item shows a red badge count of urgent items'],
            ['No metadata on cards','Removed Scanned/Notified/Barcode from list — these belong only in the edit view'],
            ['Hover-reveal checkboxes','Checkboxes are hidden at rest, appear on hover — cleaner default state'],
          ].map(([t,d]) => (
            <div key={t} style={{ display:'flex', gap:10 }}>
              <i className="bi bi-check2" style={{ color:A, fontSize:14, flexShrink:0, marginTop:1 }} />
              <div>
                <div style={{ fontSize:12, fontWeight:600, color:'white', marginBottom:2 }}>{t}</div>
                <div style={{ fontSize:11, color:'oklch(0.60 0.01 70)', lineHeight:1.55 }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
