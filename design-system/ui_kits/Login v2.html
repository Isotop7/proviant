<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proviant — Login v2</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }

body {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: translateX(0); }
}

.fade-up { animation: fadeUp 380ms var(--ease-out) both; }
.fade-up-1 { animation: fadeUp 380ms 60ms var(--ease-out) both; }
.fade-up-2 { animation: fadeUp 380ms 120ms var(--ease-out) both; }
.fade-up-3 { animation: fadeUp 380ms 180ms var(--ease-out) both; }
.fade-up-4 { animation: fadeUp 380ms 240ms var(--ease-out) both; }
.fade-up-5 { animation: fadeUp 380ms 300ms var(--ease-out) both; }

/* ── Layout ── */
.login-root {
  display: flex;
  min-height: 100vh;
}

/* ── Left panel ── */
.login-brand {
  width: 440px;
  flex-shrink: 0;
  background: var(--accent);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px 48px 44px;
}

/* Decorative circles */
.login-brand::before {
  content: '';
  position: absolute;
  width: 340px; height: 340px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  top: -80px; right: -100px;
}
.login-brand::after {
  content: '';
  position: absolute;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  bottom: 40px; left: -60px;
}
.brand-circle-sm {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  bottom: 160px; right: 30px;
}

.brand-top { position: relative; z-index: 1; }
.brand-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 52px;
}
.brand-logo-mark {
  width: 44px; height: 44px;
  background: rgba(255,255,255,0.18);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.25);
}
.brand-logo-name {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
}
.brand-headline {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.8px;
  margin-bottom: 16px;
}
.brand-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.72);
  line-height: 1.6;
  max-width: 320px;
}

/* Feature list */
.brand-features {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.brand-feature {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-feature-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #fff;
  flex-shrink: 0;
}
.brand-feature-text {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  font-weight: 500;
  line-height: 1.4;
}

/* Bottom note */
.brand-bottom {
  position: relative;
  z-index: 1;
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.2px;
}

/* ── Right panel ── */
.login-form-panel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 32px;
  background: var(--bg);
  overflow-y: auto;
}

.login-form-inner {
  width: 100%;
  max-width: 380px;
}

/* ── Tab switcher ── */
.auth-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-subtle);
  gap: 0;
  margin-bottom: 32px;
}
.auth-tab {
  padding: 10px 20px;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 500;
  color: var(--fg-3);
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: color 150ms ease, border-color 150ms ease;
  margin-bottom: -1px;
  letter-spacing: -0.1px;
}
.auth-tab:hover { color: var(--fg-2); }
.auth-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ── Form heading ── */
.form-heading {
  margin-bottom: 28px;
}
.form-heading-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}
.form-heading-sub {
  font-size: 13px;
  color: var(--fg-2);
  line-height: 1.5;
}

/* ── Field ── */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}
.field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-2);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.field-input-wrap {
  position: relative;
}
.field-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-3);
  font-size: 15px;
  pointer-events: none;
  transition: color 150ms ease;
}
.field-input {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 12px 0 38px;
  height: 44px;
  width: 100%;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.field-input::placeholder { color: var(--fg-3); }
.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px oklch(0.50 0.12 162 / 0.12);
}
.field-input:focus + .field-icon,
.field-input-wrap:focus-within .field-icon {
  color: var(--accent);
}
.field-input.error {
  border-color: var(--status-expired);
  box-shadow: 0 0 0 3px oklch(0.55 0.20 25 / 0.10);
}
.field-error {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--status-expired);
}

/* ── Primary button ── */
.btn-submit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  height: 44px;
  border-radius: 10px;
  border: 1px solid var(--accent-active);
  background: var(--accent);
  color: white;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.1px;
  margin-top: 8px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.12);
  transition: background 150ms ease, box-shadow 150ms ease, transform 120ms ease;
}
.btn-submit:hover:not(:disabled) {
  background: var(--accent-hover);
  box-shadow: 0 3px 10px oklch(0.50 0.12 162 / 0.35), 0 1px 0 rgba(0,0,0,0.12);
  transform: translateY(-1px);
}
.btn-submit:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: none;
}
.btn-submit:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}


/* ── Password toggle ── */
.pwd-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--fg-3);
  font-size: 15px;
  padding: 0;
  display: flex;
  align-items: center;
  transition: color 150ms;
}
.pwd-toggle:hover { color: var(--fg-2); }

/* ── Forgot password ── */
.forgot-link {
  display: flex;
  justify-content: flex-end;
  margin-top: -10px;
  margin-bottom: 16px;
}
.forgot-link a {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
.forgot-link a:hover { text-decoration: underline; }

/* ── Terms note ── */
.terms-note {
  margin-top: 16px;
  font-size: 11px;
  color: var(--fg-3);
  line-height: 1.6;
  text-align: center;
}
.terms-note a {
  color: var(--fg-2);
  text-decoration: underline;
}

/* ── Toast ── */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: white;
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 100;
  min-width: 280px;
  max-width: 360px;
  animation: toastIn 250ms var(--ease-out) both;
}
.toast-bar {
  width: 3px;
  align-self: stretch;
  border-radius: 2px;
  flex-shrink: 0;
}
.toast-body { flex: 1; }
.toast-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 1px;
}
.toast-msg {
  font-size: 12px;
  color: var(--fg-2);
}
.toast-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--fg-3);
  font-size: 16px;
  padding: 0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.toast-close:hover { color: var(--fg-2); }

/* ── Mobile ── */
@media (max-width: 768px) {
  .login-brand { display: none; }
  .login-form-panel {
    align-items: flex-start;
    padding: 40px 24px;
  }
  .login-form-inner { max-width: 100%; }
  .mobile-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .mobile-logo-mark {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px; font-weight: 700;
  }
  .mobile-logo-name {
    font-size: 20px; font-weight: 700; color: var(--fg); letter-spacing: -0.4px;
  }
}
@media (min-width: 769px) {
  .mobile-logo { display: none; }
}

/* ── Strength meter ── */
.strength-meter {
  display: flex;
  gap: 3px;
  margin-top: 6px;
}
.strength-bar {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  transition: background 300ms ease;
}
.strength-label {
  font-size: 11px;
  margin-top: 4px;
  font-weight: 500;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function LoginV2() {
  const [mode, setMode] = React.useState('signin');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [name, setName] = React.useState('');
  const [showPwd, setShowPwd] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [errors, setErrors] = React.useState({});
  const [submitted, setSubmitted] = React.useState(false);

  // password strength
  const strength = React.useMemo(() => {
    if (!password) return 0;
    let s = 0;
    if (password.length >= 8) s++;
    if (/[A-Z]/.test(password)) s++;
    if (/[0-9]/.test(password)) s++;
    if (/[^A-Za-z0-9]/.test(password)) s++;
    return s;
  }, [password]);

  const strengthColors = ['var(--status-expired)', 'var(--status-critical)', 'var(--status-soon)', 'var(--status-fresh)'];
  const strengthLabels = ['Weak', 'Fair', 'Good', 'Strong'];

  const validate = () => {
    const e = {};
    if (mode === 'signup' && !name.trim()) e.name = 'Display name is required';
    if (!email.trim()) e.email = 'Email is required';
    else if (!/\S+@\S+\.\S+/.test(email)) e.email = 'Enter a valid email address';
    if (!password) e.password = 'Password is required';
    else if (mode === 'signup' && password.length < 8) e.password = 'Password must be at least 8 characters';
    return e;
  };

  const showToast = (type, title, msg) => {
    setToast({ type, title, msg });
    setTimeout(() => setToast(null), 4000);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    setSubmitted(true);
    const errs = validate();
    setErrors(errs);
    if (Object.keys(errs).length > 0) return;

    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (mode === 'signin') {
        showToast('success', 'Welcome back!', `Signed in as ${email}`);
      } else {
        showToast('success', 'Account created!', `Welcome to Proviant, ${name}.`);
      }
    }, 1100);
  };

  const switchMode = (m) => {
    setMode(m);
    setErrors({});
    setSubmitted(false);
    setPassword('');
  };

  const fieldErr = (key) => submitted && errors[key];

  return (
    <div className="login-root">

      {/* Toast */}
      {toast && (
        <div className="toast">
          <div className="toast-bar" style={{ background: toast.type === 'success' ? 'var(--status-fresh)' : 'var(--status-expired)' }} />
          <div className="toast-body">
            <div className="toast-title">{toast.title}</div>
            <div className="toast-msg">{toast.msg}</div>
          </div>
          <button className="toast-close" onClick={() => setToast(null)}>
            <i className="bi bi-x" />
          </button>
        </div>
      )}

      {/* ── Left brand panel ── */}
      <aside className="login-brand">
        <div className="brand-circle-sm" />

        <div className="brand-top">
          <div className="brand-logo">
            <div className="brand-logo-mark">P</div>
            <div className="brand-logo-name">proviant</div>
          </div>
          <div className="brand-headline">
            Less waste.<br />More meals.
          </div>
          <div className="brand-sub">
            Track what's in your pantry, get notified before things expire, and discover recipes with what you already have.
          </div>
        </div>

        <div className="brand-features">
          <div className="brand-feature">
            <div className="brand-feature-icon">
              <i className="bi bi-upc-scan" />
            </div>
            <div className="brand-feature-text">Scan barcodes to add products instantly</div>
          </div>
          <div className="brand-feature">
            <div className="brand-feature-icon">
              <i className="bi bi-bell" />
            </div>
            <div className="brand-feature-text">Get notified before items expire</div>
          </div>
          <div className="brand-feature">
            <div className="brand-feature-icon">
              <i className="bi bi-journal-richtext" />
            </div>
            <div className="brand-feature-text">Recipe suggestions from your pantry</div>
          </div>
          <div className="brand-feature">
            <div className="brand-feature-icon">
              <i className="bi bi-graph-down-arrow" />
            </div>
            <div className="brand-feature-text">Track savings and reduce food waste</div>
          </div>
        </div>

        <div className="brand-bottom">
          © 2026 Proviant · Free to use · Open source
        </div>
      </aside>

      {/* ── Right form panel ── */}
      <div className="login-form-panel">
        <div className="login-form-inner">

          {/* Mobile logo */}
          <div className="mobile-logo">
            <div className="mobile-logo-mark">P</div>
            <div className="mobile-logo-name">proviant</div>
          </div>

          {/* Tab switcher */}
          <div className="auth-tabs fade-up">
            <button
              className={`auth-tab ${mode === 'signin' ? 'active' : ''}`}
              onClick={() => switchMode('signin')}
            >
              Sign in
            </button>
            <button
              className={`auth-tab ${mode === 'signup' ? 'active' : ''}`}
              onClick={() => switchMode('signup')}
            >
              Create account
            </button>
          </div>

          {/* Form heading */}
          <div className="form-heading fade-up-1">
            {mode === 'signin' ? (
              <>
                <div className="form-heading-title">Welcome back</div>
                <div className="form-heading-sub">Sign in to your Proviant account</div>
              </>
            ) : (
              <>
                <div className="form-heading-title">Get started free</div>
                <div className="form-heading-sub">Create your household account</div>
              </>
            )}
          </div>

          {/* Form */}
          <form onSubmit={handleSubmit} noValidate>

            {/* Name (signup only) */}
            {mode === 'signup' && (
              <div className="field fade-up-1">
                <label className="field-label">Display name</label>
                <div className="field-input-wrap">
                  <input
                    className={`field-input ${fieldErr('name') ? 'error' : ''}`}
                    type="text"
                    placeholder="Your name"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    autoComplete="name"
                  />
                  <i className="bi bi-person field-icon" />
                </div>
                {fieldErr('name') && (
                  <div className="field-error">
                    <i className="bi bi-exclamation-circle-fill" style={{ fontSize: 11 }} />
                    {errors.name}
                  </div>
                )}
              </div>
            )}

            {/* Email */}
            <div className="field fade-up-2">
              <label className="field-label">Email</label>
              <div className="field-input-wrap">
                <input
                  className={`field-input ${fieldErr('email') ? 'error' : ''}`}
                  type="email"
                  placeholder="you@example.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  autoComplete="email"
                />
                <i className="bi bi-envelope field-icon" />
              </div>
              {fieldErr('email') && (
                <div className="field-error">
                  <i className="bi bi-exclamation-circle-fill" style={{ fontSize: 11 }} />
                  {errors.email}
                </div>
              )}
            </div>

            {/* Password */}
            <div className="field fade-up-3">
              <label className="field-label">Password</label>
              <div className="field-input-wrap">
                <input
                  className={`field-input ${fieldErr('password') ? 'error' : ''}`}
                  type={showPwd ? 'text' : 'password'}
                  placeholder="••••••••"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  autoComplete={mode === 'signin' ? 'current-password' : 'new-password'}
                  style={{ paddingRight: 40 }}
                />
                <i className="bi bi-lock field-icon" />
                <button
                  type="button"
                  className="pwd-toggle"
                  onClick={() => setShowPwd(v => !v)}
                  tabIndex={-1}
                >
                  <i className={`bi ${showPwd ? 'bi-eye-slash' : 'bi-eye'}`} />
                </button>
              </div>
              {/* Strength meter (signup only) */}
              {mode === 'signup' && password.length > 0 && (
                <div>
                  <div className="strength-meter">
                    {[0,1,2,3].map(i => (
                      <div
                        key={i}
                        className="strength-bar"
                        style={{ background: i < strength ? strengthColors[strength - 1] : undefined }}
                      />
                    ))}
                  </div>
                  <div className="strength-label" style={{ color: strength > 0 ? strengthColors[strength - 1] : 'var(--fg-3)' }}>
                    {strength > 0 ? strengthLabels[strength - 1] : ''}
                  </div>
                </div>
              )}
              {fieldErr('password') && (
                <div className="field-error">
                  <i className="bi bi-exclamation-circle-fill" style={{ fontSize: 11 }} />
                  {errors.password}
                </div>
              )}
            </div>

            {/* Forgot password (sign in only) */}
            {mode === 'signin' && (
              <div className="forgot-link fade-up-3">
                <a href="#" onClick={e => { e.preventDefault(); showToast('info', 'Password reset', 'Check your email for a reset link.'); }}>
                  Forgot password?
                </a>
              </div>
            )}

            {/* Submit */}
            <button
              type="submit"
              className="btn-submit fade-up-4"
              disabled={loading}
            >
              {loading
                ? <i className="bi bi-arrow-clockwise" style={{ animation: 'spin 0.7s linear infinite', fontSize: 16 }} />
                : <i className={`bi ${mode === 'signin' ? 'bi-box-arrow-in-right' : 'bi-person-plus'}`} />
              }
              {loading ? 'Please wait…' : mode === 'signin' ? 'Sign in' : 'Create account'}
            </button>

            {/* Terms (signup only) */}
            {mode === 'signup' && (
              <div className="terms-note fade-up-5">
                By creating an account you agree to our{' '}
                <a href="#">Terms of Service</a> and{' '}
                <a href="#">Privacy Policy</a>.
              </div>
            )}
          </form>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<LoginV2 />);
</script>
</body>
</html>
