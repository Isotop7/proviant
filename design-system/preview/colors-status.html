<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body { padding: 24px; background: var(--bg); }
  .statuses { display: flex; flex-direction: column; gap: 10px; }
  .status-row { display: flex; align-items: stretch; gap: 8px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: white; }
  .color-block { width: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; }
  .color-block.soon { color: oklch(0.18 0.022 70); }
  .info { padding: 10px 12px; flex: 1; display: flex; align-items: center; gap: 16px; }
  .name { font-family: var(--font-ui); font-weight: 600; font-size: 13px; color: var(--fg); width: 110px; }
  .desc { font-family: var(--font-ui); font-size: 12px; color: var(--fg-2); flex: 1; }
  .swatches { display: flex; gap: 4px; }
  .sw { width: 24px; height: 24px; border-radius: 4px; border: 1px solid oklch(0 0 0 / 0.08); }
  .badge { font-family: var(--font-ui); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="statuses">
  <div class="status-row">
    <div class="color-block" style="background: oklch(0.55 0.20 25);"><i class="bi bi-x-circle-fill"></i></div>
    <div class="info">
      <div class="name">Expired</div>
      <div class="desc">Past expiry date — act immediately</div>
      <div class="swatches">
        <div class="sw" title="base" style="background: oklch(0.55 0.20 25);"></div>
        <div class="sw" title="subtle" style="background: oklch(0.95 0.05 25);"></div>
        <div class="sw" title="border" style="background: oklch(0.80 0.12 25);"></div>
      </div>
      <span class="badge" style="background: oklch(0.95 0.05 25); color: oklch(0.55 0.20 25); border: 1px solid oklch(0.80 0.12 25);">Expired</span>
    </div>
  </div>
  <div class="status-row">
    <div class="color-block" style="background: oklch(0.64 0.18 45);"><i class="bi bi-exclamation-circle-fill"></i></div>
    <div class="info">
      <div class="name">Critical</div>
      <div class="desc">Expires within 1–3 days</div>
      <div class="swatches">
        <div class="sw" style="background: oklch(0.64 0.18 45);"></div>
        <div class="sw" style="background: oklch(0.96 0.05 45);"></div>
        <div class="sw" style="background: oklch(0.82 0.12 45);"></div>
      </div>
      <span class="badge" style="background: oklch(0.96 0.05 45); color: oklch(0.64 0.18 45); border: 1px solid oklch(0.82 0.12 45);">Critical</span>
    </div>
  </div>
  <div class="status-row">
    <div class="color-block soon" style="background: oklch(0.72 0.16 80);"><i class="bi bi-clock-fill"></i></div>
    <div class="info">
      <div class="name">Expiring soon</div>
      <div class="desc">Expires within 4–7 days</div>
      <div class="swatches">
        <div class="sw" style="background: oklch(0.72 0.16 80);"></div>
        <div class="sw" style="background: oklch(0.97 0.05 80);"></div>
        <div class="sw" style="background: oklch(0.85 0.10 80);"></div>
      </div>
      <span class="badge" style="background: oklch(0.97 0.05 80); color: oklch(0.55 0.16 80); border: 1px solid oklch(0.85 0.10 80);">Expiring soon</span>
    </div>
  </div>
  <div class="status-row">
    <div class="color-block" style="background: oklch(0.52 0.10 145);"><i class="bi bi-check-circle-fill"></i></div>
    <div class="info">
      <div class="name">Fresh</div>
      <div class="desc">More than 7 days remaining</div>
      <div class="swatches">
        <div class="sw" style="background: oklch(0.52 0.10 145);"></div>
        <div class="sw" style="background: oklch(0.94 0.04 145);"></div>
        <div class="sw" style="background: oklch(0.78 0.08 145);"></div>
      </div>
      <span class="badge" style="background: oklch(0.94 0.04 145); color: oklch(0.40 0.10 145); border: 1px solid oklch(0.78 0.08 145);">Fresh</span>
    </div>
  </div>
  <div class="status-row">
    <div class="color-block" style="background: oklch(0.60 0.010 70);"><i class="bi bi-dash-circle-fill"></i></div>
    <div class="info">
      <div class="name">No date</div>
      <div class="desc">Expiry date unknown</div>
      <div class="swatches">
        <div class="sw" style="background: oklch(0.60 0.010 70);"></div>
        <div class="sw" style="background: oklch(0.94 0.006 70);"></div>
        <div class="sw" style="background: oklch(0.80 0.008 70);"></div>
      </div>
      <span class="badge" style="background: oklch(0.94 0.006 70); color: oklch(0.45 0.010 70); border: 1px solid oklch(0.80 0.008 70);">No date</span>
    </div>
  </div>
</div>
</body>
</html>
