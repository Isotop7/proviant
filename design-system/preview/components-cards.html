<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body { padding: 20px; background: var(--bg); }
  .grid { display: flex; gap: 14px; flex-wrap: wrap; }
  .card {
    background: white; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-sm); width: 200px; overflow: hidden;
    transition: box-shadow 200ms ease-out, transform 200ms ease-out;
    position: relative;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card-img { width: 100%; height: 80px; background: repeating-linear-gradient(45deg, var(--bg-subtle), var(--bg-subtle) 4px, white 4px, white 10px); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); position: relative; }
  .card-img.has-img { background: oklch(0.93 0.02 145 / 0.3); }
  .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .card-body { padding: 12px; }
  .card-name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-cat { font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); margin-bottom: 8px; }
  .badge { font-family: var(--font-ui); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .card-meta { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .meta-row { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); display: flex; align-items: center; gap: 5px; }
  .checkbox { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border); background: white; display: flex; align-items: center; justify-content: center; }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: ''; width: 9px; height: 6px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg) translate(1px, -1px); display: block; }
</style>
</head>
<body>
<div class="grid">
  <!-- Expired -->
  <div class="card">
    <div class="card-img"><div class="status-bar" style="background: oklch(0.55 0.20 25);"></div>product image</div>
    <div class="checkbox"></div>
    <div class="card-body">
      <div class="card-name">Greek Yogurt</div>
      <div class="card-cat">Dairy</div>
      <span class="badge" style="background: oklch(0.95 0.05 25); color: oklch(0.45 0.20 25); border: 1px solid oklch(0.80 0.12 25);"><i class="bi bi-x-circle-fill"></i> Expired</span>
      <div class="card-meta">
        <div class="meta-row"><i class="bi bi-calendar-x"></i> Apr 17, 2026</div>
        <div class="meta-row"><i class="bi bi-upc-scan"></i> 5000169002009</div>
      </div>
    </div>
  </div>
  <!-- Critical -->
  <div class="card">
    <div class="card-img"><div class="status-bar" style="background: oklch(0.64 0.18 45);"></div>product image</div>
    <div class="checkbox"></div>
    <div class="card-body">
      <div class="card-name">Whole Milk 1L</div>
      <div class="card-cat">Dairy</div>
      <span class="badge" style="background: oklch(0.96 0.05 45); color: oklch(0.50 0.18 45); border: 1px solid oklch(0.82 0.12 45);"><i class="bi bi-exclamation-circle-fill"></i> in 2 days</span>
      <div class="card-meta">
        <div class="meta-row"><i class="bi bi-calendar-event"></i> Apr 22, 2026</div>
        <div class="meta-row"><i class="bi bi-bell"></i> Notification on</div>
      </div>
    </div>
  </div>
  <!-- Fresh + selected -->
  <div class="card" style="outline: 2px solid var(--accent); outline-offset: -1px;">
    <div class="card-img has-img"><div class="status-bar" style="background: oklch(0.52 0.10 145);"></div><i class="bi bi-apple" style="font-size: 28px; color: oklch(0.52 0.10 145 / 0.5);"></i></div>
    <div class="checkbox checked"></div>
    <div class="card-body">
      <div class="card-name">Orange Juice</div>
      <div class="card-cat">Beverages</div>
      <span class="badge" style="background: oklch(0.94 0.04 145); color: oklch(0.38 0.10 145); border: 1px solid oklch(0.78 0.08 145);"><i class="bi bi-check-circle-fill"></i> Fresh</span>
      <div class="card-meta">
        <div class="meta-row"><i class="bi bi-calendar-event"></i> May 10, 2026</div>
      </div>
    </div>
  </div>
  <!-- No date -->
  <div class="card">
    <div class="card-img"><div class="status-bar" style="background: oklch(0.60 0.010 70);"></div>product image</div>
    <div class="checkbox"></div>
    <div class="card-body">
      <div class="card-name">Olive Oil Extra Virgin</div>
      <div class="card-cat">Pantry</div>
      <span class="badge" style="background: oklch(0.94 0.006 70); color: oklch(0.45 0.010 70); border: 1px solid oklch(0.80 0.008 70);"><i class="bi bi-dash-circle-fill"></i> No date</span>
      <div class="card-meta">
        <div class="meta-row"><i class="bi bi-upc-scan"></i> 8410179132041</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
