<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body { padding: 24px; background: var(--bg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  h3 { font-family: var(--font-ui); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .btn { font-family: var(--font-ui); font-size: 13px; font-weight: 500; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 150ms ease-out, box-shadow 150ms ease-out; }
  .btn-sm  { padding: 5px 12px; font-size: 12px; }
  .btn-md  { padding: 8px 16px; }
  .btn-lg  { padding: 11px 22px; font-size: 15px; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg-subtle); }
  .btn-ghost { background: transparent; color: var(--fg-2); }
  .btn-ghost:hover { background: var(--bg-subtle); color: var(--fg); }
  .btn-danger { background: var(--status-expired); color: white; }
  .btn-danger:hover { background: var(--status-expired-hover); }
  .btn-disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
  .btn-loading { opacity: 0.7; cursor: wait; }
  .divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 0; }
</style>
</head>
<body>
<h3>Primary</h3>
<div class="row">
  <button class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Add product</button>
  <button class="btn btn-primary btn-md"><i class="bi bi-plus-lg"></i> Add product</button>
  <button class="btn btn-primary btn-lg"><i class="bi bi-plus-lg"></i> Add product</button>
  <button class="btn btn-primary btn-md btn-disabled">Add product</button>
  <button class="btn btn-primary btn-md btn-loading"><i class="bi bi-arrow-clockwise" style="animation: spin 0.8s linear infinite;"></i> Saving…</button>
</div>
<hr class="divider">
<h3>Secondary</h3>
<div class="row">
  <button class="btn btn-secondary btn-sm">Cancel</button>
  <button class="btn btn-secondary btn-md"><i class="bi bi-funnel"></i> Filter</button>
  <button class="btn btn-secondary btn-md"><i class="bi bi-archive"></i> Archive</button>
  <button class="btn btn-secondary btn-md btn-disabled">Disabled</button>
</div>
<hr class="divider">
<h3>Ghost & Danger</h3>
<div class="row">
  <button class="btn btn-ghost btn-md"><i class="bi bi-arrow-counterclockwise"></i> Restore</button>
  <button class="btn btn-ghost btn-sm"><i class="bi bi-pencil"></i> Edit</button>
  <button class="btn btn-danger btn-md"><i class="bi bi-trash3"></i> Delete</button>
  <button class="btn btn-danger btn-sm">Delete selected</button>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
