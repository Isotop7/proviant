<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body { padding: 24px; background: var(--bg); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  h3 { font-family: var(--font-ui); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 0; }
  /* Status badges */
  .badge { font-family: var(--font-ui); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; line-height: 1.4; }
  .badge i { font-size: 11px; }
  /* Dot */
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  /* Count chip */
  .chip { font-family: var(--font-ui); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: white; }
  /* Category pill */
  .cat { font-family: var(--font-ui); font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--bg-subtle); color: var(--fg-2); border: 1px solid var(--border); }
</style>
</head>
<body>
<h3>Status Badges</h3>
<div class="row">
  <span class="badge" style="background: oklch(0.95 0.05 25); color: oklch(0.45 0.20 25); border: 1px solid oklch(0.80 0.12 25);"><i class="bi bi-x-circle-fill"></i> Expired</span>
  <span class="badge" style="background: oklch(0.96 0.05 45); color: oklch(0.50 0.18 45); border: 1px solid oklch(0.82 0.12 45);"><i class="bi bi-exclamation-circle-fill"></i> Critical</span>
  <span class="badge" style="background: oklch(0.97 0.05 80); color: oklch(0.50 0.16 80); border: 1px solid oklch(0.85 0.10 80);"><i class="bi bi-clock-fill"></i> Expiring soon</span>
  <span class="badge" style="background: oklch(0.94 0.04 145); color: oklch(0.38 0.10 145); border: 1px solid oklch(0.78 0.08 145);"><i class="bi bi-check-circle-fill"></i> Fresh</span>
  <span class="badge" style="background: oklch(0.94 0.006 70); color: oklch(0.45 0.010 70); border: 1px solid oklch(0.80 0.008 70);"><i class="bi bi-dash-circle-fill"></i> No date</span>
</div>
<hr class="divider">
<h3>Dot Indicators (used inside cards)</h3>
<div class="row">
  <span class="dot" style="background: oklch(0.55 0.20 25);"></span>
  <span class="dot" style="background: oklch(0.64 0.18 45);"></span>
  <span class="dot" style="background: oklch(0.72 0.16 80);"></span>
  <span class="dot" style="background: oklch(0.52 0.10 145);"></span>
  <span class="dot" style="background: oklch(0.60 0.010 70);"></span>
</div>
<hr class="divider">
<h3>Category Pills</h3>
<div class="row">
  <span class="cat"><i class="bi bi-egg-fried"></i> Dairy</span>
  <span class="cat"><i class="bi bi-apple"></i> Produce</span>
  <span class="cat"><i class="bi bi-cup-hot"></i> Beverages</span>
  <span class="cat"><i class="bi bi-box2"></i> Pantry</span>
  <span class="cat"><i class="bi bi-snow2"></i> Frozen</span>
  <span class="cat"><i class="bi bi-basket2"></i> Meat</span>
</div>
<hr class="divider">
<h3>Count Chips (nav / filter)</h3>
<div class="row">
  <span class="chip">3</span>
  <span class="chip" style="background: oklch(0.55 0.20 25);">2</span>
  <span class="chip" style="background: oklch(0.60 0.010 70);">12</span>
</div>
</body>
</html>
