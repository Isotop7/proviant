<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proviant — Accent Surface Design Baseline</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGBu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: oklch(0.14 0.01 70);
    color: white;
    min-height: 100vh;
    padding: 48px 40px;
    -webkit-font-smoothing: antialiased;
  }
  h2 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: oklch(0.55 0.01 70);
    margin: 40px 0 16px;
  }
  h2:first-of-type { margin-top: 0; }
  .note {
    font-size: 11px;
    color: oklch(0.45 0.01 70);
    line-height: 1.6;
    margin-bottom: 24px;
    max-width: 640px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .divider {
    border: none;
    border-top: 1px solid oklch(0.22 0.01 70);
    margin: 48px 0 0;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── TOKENS (mirroring colors_and_type.css) ── */
const A   = 'oklch(0.50 0.12 162)';   // --accent
const AH  = 'oklch(0.44 0.12 162)';   // --accent-hover
const AS  = 'oklch(0.93 0.04 162)';   // --accent-subtle
const FG  = 'oklch(0.18 0.022 70)';   // --fg
const F2  = 'oklch(0.48 0.018 70)';   // --fg-2
const F3  = 'oklch(0.65 0.012 70)';   // --fg-3
const BG  = 'oklch(0.98 0.012 75)';   // --bg
const BD  = 'oklch(0.88 0.010 75)';   // --border
const WH  = '#ffffff';

/*
 * ACCENT SURFACE PATTERN
 * ───────────────────────
 * Source: .hero-scan-card in main.scss (mobile dashboard CTA card)
 *
 * Core rules:
 *  1. background: --accent (oklch(0.50 0.12 162))
 *  2. box-shadow: 0 Npx Mpx oklch(0.50 0.12 162 / α)   ← shadow same hue as bg
 *  3. Decorative orbs via ::before / ::after — white circles, 6-8% opacity
 *  4. Text: label (10px, uppercase, 65% white) / title (bold, white) / sub (70% white)
 *  5. Glass pill: rgba(255,255,255,0.20) — interactive element on accent surface
 *  6. Hover: opacity .92 (card) or darken to --accent-hover (button)
 *
 * Scale the shadow α and blur by component size:
 *  - button   : 0 4px 12px oklch(0.50 0.12 162 / 0.35)
 *  - card-sm  : 0 6px 18px oklch(0.50 0.12 162 / 0.30)
 *  - card-hero: 0 8px 24px oklch(0.50 0.12 162 / 0.30)
 */

/* ── SHARED ORB STYLE ── */
const orbBase = {
  position: 'absolute',
  borderRadius: 999,
  background: 'rgba(255,255,255,0.08)',
  pointerEvents: 'none',
};

/* ──────────────────────────────────────────────
   BUTTONS
────────────────────────────────────────────── */

function BtnPrimary({ icon, label, size = 'md' }) {
  const [hov, setHov] = React.useState(false);
  const pad = size === 'sm' ? '6px 14px' : size === 'lg' ? '13px 24px' : '9px 18px';
  const fs  = size === 'sm' ? 12 : size === 'lg' ? 15 : 13;
  return (
    <button
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 7,
        background: hov ? AH : A,
        color: WH,
        border: 'none',
        borderRadius: 9,
        padding: pad,
        fontSize: fs,
        fontWeight: 600,
        fontFamily: 'var(--font-ui)',
        cursor: 'pointer',
        boxShadow: `0 4px 12px oklch(0.50 0.12 162 / ${hov ? '0.50' : '0.35'})`,
        transition: 'background 150ms, box-shadow 150ms',
        position: 'relative',
      }}>
      {icon && <i className={`bi ${icon}`} style={{ fontSize: fs + 1 }} />}
      {label}
    </button>
  );
}

function BtnGhost({ icon, label }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 7,
        background: hov ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.10)',
        color: WH,
        border: '1px solid rgba(255,255,255,0.25)',
        borderRadius: 9,
        padding: '9px 18px',
        fontSize: 13,
        fontWeight: 600,
        fontFamily: 'var(--font-ui)',
        cursor: 'pointer',
        transition: 'background 150ms',
      }}>
      {icon && <i className={`bi ${icon}`} style={{ fontSize: 14 }} />}
      {label}
    </button>
  );
}

/* Glass pill — for use inside accent-surface containers */
function Pill({ icon, label }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 8,
      background: 'rgba(255,255,255,0.20)',
      borderRadius: 99,
      padding: '7px 14px',
      color: WH,
      fontSize: 12,
      fontWeight: 600,
      fontFamily: 'var(--font-ui)',
    }}>
      {icon && <i className={`bi ${icon}`} style={{ fontSize: 14 }} />}
      {label}
    </span>
  );
}

/* ──────────────────────────────────────────────
   CARDS
────────────────────────────────────────────── */

/* Source: .hero-scan-card — full mobile dashboard CTA card */
function HeroCard({ label, title, sub, pillIcon, pillLabel }) {
  const [hov, setHov] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: A,
        borderRadius: 16,
        padding: 18,
        position: 'relative',
        overflow: 'hidden',
        boxShadow: `0 8px 24px oklch(0.50 0.12 162 / 0.30)`,
        opacity: hov ? 0.92 : 1,
        transition: 'opacity 120ms',
        cursor: 'pointer',
        width: 240,
      }}>
      {/* Decorative orbs */}
      <div style={{ ...orbBase, right: -16, top: -16, width: 100, height: 100 }} />
      <div style={{ ...orbBase, right: 16, bottom: -24, width: 70, height: 70, background: 'rgba(255,255,255,0.06)' }} />

      <div style={{ position: 'relative' }}>
        <div style={{ fontSize: 10, fontWeight: 700, color: 'rgba(255,255,255,0.65)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 6 }}>{label}</div>
        <div style={{ fontSize: 18, fontWeight: 700, color: WH, marginBottom: 3 }}>{title}</div>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.70)', marginBottom: 14 }}>{sub}</div>
        <Pill icon={pillIcon} label={pillLabel} />
      </div>
    </div>
  );
}

/* Compact accent card — stat / metric display */
function AccentStatCard({ icon, value, label }) {
  return (
    <div style={{
      background: A,
      borderRadius: 12,
      padding: '16px 18px',
      position: 'relative',
      overflow: 'hidden',
      boxShadow: `0 6px 18px oklch(0.50 0.12 162 / 0.30)`,
      width: 140,
    }}>
      <div style={{ ...orbBase, right: -10, top: -10, width: 70, height: 70 }} />
      <div style={{ position: 'relative' }}>
        <i className={`bi ${icon}`} style={{ fontSize: 22, color: 'rgba(255,255,255,0.70)', display: 'block', marginBottom: 8 }} />
        <div style={{ fontSize: 28, fontWeight: 700, color: WH, lineHeight: 1, letterSpacing: '-0.02em' }}>{value}</div>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.65)', marginTop: 4 }}>{label}</div>
      </div>
    </div>
  );
}

/* Feature card — icon + title + description, accent-tinted */
function FeatureCard({ icon, title, desc }) {
  const [hov, setHov] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: WH,
        border: `1px solid oklch(0.78 0.08 162)`,
        borderRadius: 12,
        padding: '16px 18px',
        width: 200,
        boxShadow: hov
          ? '0 6px 18px oklch(0.50 0.12 162 / 0.18)'
          : '0 1px 3px oklch(0.18 0.02 70 / 0.07)',
        transition: 'box-shadow 150ms, transform 150ms',
        transform: hov ? 'translateY(-1px)' : 'none',
      }}>
      <div style={{
        width: 38, height: 38, borderRadius: 9,
        background: AS, display: 'flex', alignItems: 'center', justifyContent: 'center',
        marginBottom: 12,
      }}>
        <i className={`bi ${icon}`} style={{ fontSize: 18, color: A }} />
      </div>
      <div style={{ fontSize: 13, fontWeight: 600, color: FG, marginBottom: 4 }}>{title}</div>
      <div style={{ fontSize: 11, color: F3, lineHeight: 1.55 }}>{desc}</div>
    </div>
  );
}

/* Icon badge — used in modal headers and list items */
function IconBadge({ icon, size = 'md' }) {
  const dim = size === 'sm' ? 32 : size === 'lg' ? 48 : 40;
  const fs  = size === 'sm' ? 14 : size === 'lg' ? 22 : 18;
  const br  = size === 'sm' ? 7  : size === 'lg' ? 12 : 9;
  return (
    <div style={{
      width: dim, height: dim, borderRadius: br,
      background: A,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: `0 2px 8px oklch(0.50 0.12 162 / 0.40)`,
      flexShrink: 0,
    }}>
      <i className={`bi ${icon}`} style={{ fontSize: fs, color: WH }} />
    </div>
  );
}

/* ──────────────────────────────────────────────
   SHOWCASE
────────────────────────────────────────────── */
function Showcase() {
  return (
    <div>
      {/* Header */}
      <div style={{ marginBottom: 40 }}>
        <div style={{ fontSize: 22, fontWeight: 700, color: WH, marginBottom: 6, letterSpacing: '-0.02em' }}>
          Accent Surface — Design Baseline
        </div>
        <div style={{ fontSize: 13, color: 'oklch(0.50 0.01 70)', maxWidth: 580, lineHeight: 1.6 }}>
          Extracted from <code style={{ fontFamily: 'monospace', fontSize: 12, color: 'oklch(0.60 0.08 162)' }}>.hero-scan-card</code> (mobile dashboard CTA).
          Core pattern: accent-fill background + same-hue colored shadow + decorative white orbs + glass pill.
          Scale shadow blur and alpha by component size. Use <code style={{ fontFamily: 'monospace', fontSize: 12, color: 'oklch(0.60 0.08 162)' }}>--accent-subtle</code> + accent border for surface-light variants.
        </div>
      </div>

      <h2>Buttons</h2>
      <p className="note">
        Primary button: accent fill + colored shadow. Hover darkens background (<code>--accent-hover</code>) and intensifies shadow.
        Ghost button: use inside accent containers — white glass background, white border. Never use ghost on light surfaces.
      </p>
      <div className="row" style={{ marginBottom: 8 }}>
        <BtnPrimary icon="bi-plus-lg" label="Add product" size="sm" />
        <BtnPrimary icon="bi-plus-lg" label="Add product" />
        <BtnPrimary icon="bi-upc-scan" label="Start scanning" size="lg" />
      </div>
      <div className="row" style={{ marginTop: 16, padding: 20, background: A, borderRadius: 12, width: 'fit-content' }}>
        <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.65)', alignSelf: 'center', marginRight: 8 }}>on accent bg →</span>
        <BtnGhost icon="bi-camera" label="Start webcam scan" />
        <Pill icon="bi-upc-scan" label="Scan barcode" />
      </div>

      <hr className="divider" />

      <h2>Icon badges</h2>
      <p className="note">
        Rounded-square icon wrapper on solid accent. Used in modal headers and list item leading visuals.
        Same-hue shadow gives elevation without going to grey.
      </p>
      <div className="row">
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <IconBadge icon="bi-upc-scan" size="sm" />
          <span style={{ fontSize: 10, color: F3 }}>sm 32px</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <IconBadge icon="bi-upc-scan" size="md" />
          <span style={{ fontSize: 10, color: F3 }}>md 40px</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <IconBadge icon="bi-upc-scan" size="lg" />
          <span style={{ fontSize: 10, color: F3 }}>lg 48px</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <IconBadge icon="bi-plus-lg" size="md" />
          <span style={{ fontSize: 10, color: F3 }}>add</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <IconBadge icon="bi-box-seam" size="md" />
          <span style={{ fontSize: 10, color: F3 }}>products</span>
        </div>
      </div>

      <hr className="divider" />

      <h2>Hero CTA card — source component</h2>
      <p className="note">
        Full-bleed accent card with two decorative orbs (::before top-right 100px / ::after bottom-right 70px, both white 6–8%).
        Label → title → sub text stack. Glass pill as primary action affordance.
        Hover: opacity 0.92 (entire card). Shadow: <code>0 8px 24px oklch(0.50 0.12 162 / 0.30)</code>.
      </p>
      <div className="row">
        <HeroCard
          label="Quick action"
          title="Scan a product"
          sub="Add to your pantry in seconds"
          pillIcon="bi-upc-scan"
          pillLabel="Start scanning"
        />
        <HeroCard
          label="Expiring soon"
          title="3 products"
          sub="Check your dairy and bakery items"
          pillIcon="bi-arrow-right"
          pillLabel="View all"
        />
      </div>

      <hr className="divider" />

      <h2>Compact stat card</h2>
      <p className="note">
        Smaller accent card for dashboard metrics. Single orb (top-right, 70px).
        Shadow: <code>0 6px 18px oklch(0.50 0.12 162 / 0.30)</code>.
        Large tabular number as hero value; small label beneath.
      </p>
      <div className="row">
        <AccentStatCard icon="bi-box-seam" value="24" label="Active products" />
        <AccentStatCard icon="bi-exclamation-triangle" value="3" label="Expiring soon" />
        <AccentStatCard icon="bi-archive" value="11" label="Archived" />
      </div>

      <hr className="divider" />

      <h2>Feature card — surface-light variant</h2>
      <p className="note">
        White surface with accent-tinted border (<code>oklch(0.78 0.08 162)</code>) and accent-subtle icon badge.
        Hover lifts with accent-colored shadow — same hue, low alpha.
        Use for feature tiles, quick-action grids, category cards.
      </p>
      <div className="row">
        <FeatureCard icon="bi-upc-scan"     title="Scan barcode"     desc="Auto-fill product data from OpenFoodFacts" />
        <FeatureCard icon="bi-pencil"        title="Edit product"     desc="Update name, expiry date or category" />
        <FeatureCard icon="bi-archive"       title="Archive"          desc="Keep a record without cluttering your list" />
        <FeatureCard icon="bi-bell"          title="Notifications"    desc="Get reminded before products expire" />
      </div>

      <hr className="divider" />

      {/* Token reference table */}
      <h2>Token reference</h2>
      <div style={{ fontFamily: 'monospace', fontSize: 11, color: 'oklch(0.55 0.01 70)', lineHeight: 2, maxWidth: 560 }}>
        {[
          ['--accent',                 'oklch(0.50 0.12 162)', 'Primary fill on buttons and cards'],
          ['--accent-hover',           'oklch(0.44 0.12 162)', 'Hover state — darken by ~6 L steps'],
          ['--accent-active',          'oklch(0.40 0.12 162)', 'Pressed state'],
          ['--accent-subtle',          'oklch(0.93 0.04 162)', 'Icon badge bg / tinted surface'],
          ['--accent-fg',              'oklch(0.98 0.006 75)', 'Text on accent fill'],
          ['shadow-button',            '0 4px 12px oklch(0.50 0.12 162 / 0.35)', 'Button shadow'],
          ['shadow-card-sm',           '0 6px 18px oklch(0.50 0.12 162 / 0.30)', 'Small card'],
          ['shadow-card-hero',         '0 8px 24px oklch(0.50 0.12 162 / 0.30)', 'Hero card'],
          ['orb-primary',              'rgba(255,255,255,0.08)', '::before top-right'],
          ['orb-secondary',            'rgba(255,255,255,0.06)', '::after bottom-right'],
          ['glass-pill',               'rgba(255,255,255,0.20)', 'Glass pill on accent surface'],
          ['label-on-accent',          'rgba(255,255,255,0.65)', 'Eyebrow / label text'],
          ['sub-on-accent',            'rgba(255,255,255,0.70)', 'Sub / description text'],
          ['icon-on-accent',           'rgba(255,255,255,0.70)', 'Icon on accent surface'],
          ['accent-border (light)',    'oklch(0.78 0.08 162)', 'Border on light-surface variant'],
        ].map(([token, value, desc]) => (
          <div key={token} style={{ display: 'grid', gridTemplateColumns: '220px 280px 1fr', gap: 8 }}>
            <span style={{ color: 'oklch(0.60 0.08 162)' }}>{token}</span>
            <span>{value}</span>
            <span style={{ color: 'oklch(0.40 0.01 70)' }}>{desc}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Showcase />);
</script>
</body>
</html>
