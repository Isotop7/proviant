services:
  database:
    image: mariadb:11.0
    restart: always
    environment:
      - MARIADB_DATABASE=proviant
      - MARIADB_ROOT_PASSWORD=proviant
      - MARIADB_USER=proviant
      - MARIADB_PASSWORD=supersecretpassword
    volumes:
      - proviantdb:/var/lib/mysql

  smtp:
    image: rnwood/smtp4dev:latest
    restart: always
    ports:
      - "81:80"
    volumes:
      - smtpdb:/smtp4dev

  proviant:
    build: ./
    restart: always
    ports:
      - "5114:5114"
    depends_on:
      - database
    environment:
      - GIN_MODE=debug
      - PROVIANT_LOGGING_ENABLED=true
      - PROVIANT_LOGGING_FILE=logs/proviant.log
      - PROVIANT_DATABASE_ENGINE=mariadb
      - PROVIANT_DATABASE_MARIADB_HOST=database
      - PROVIANT_DATABASE_MARIADB_USER=proviant
      - PROVIANT_DATABASE_MARIADB_PASSWORD=supersecretpassword
      - PROVIANT_NOTIFICATION_SMTP_HOST=smtp
      - PROVIANT_NOTIFICATION_SMTP_FROMADDRESS=proviant@yourdomain.com
      - "PROVIANT_SERVER_AUTHENTICATION_TOKENPASSWORD=${PROVIANT_JWT_SECRET:?PROVIANT_JWT_SECRET is not set - add it to .env, generate with openssl rand -hex 32}"
    volumes:
      - proviantlogs:/app/logs
    healthcheck:
      test: ['CMD-SHELL', 'probe_host="$${PROVIANT_SERVER_HOST:-127.0.0.1}"; case "$$probe_host" in ""|"::"|"0.0.0.0") probe_host=127.0.0.1 ;; *:*) probe_host="[$$probe_host]" ;; esac; wget --quiet -O /dev/null "http://$$probe_host:$${PROVIANT_SERVER_PORT:-5114}/health/ready"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    links:
      - database
      - smtp

volumes:
  proviantdb: {}
  proviantlogs: {}
  smtpdb: {}
