image: golang:latest

stages:
  - test
  - build
  - distribute

check:
  stage: test
  script:
    - cd ./src
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)
    - go run honnef.co/go/tools/cmd/staticcheck@latest -checks=all,-ST1000,-U1000 ./...
    - go test -race $(go list ./... | grep -v /vendor/)
    - go mod verify
  rules:
  - changes:
    - src/**/*
    - .gitlab-ci.yml

lint:
  image: docker:cli
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: golangci/golangci-lint:v1.55.2
  script:
    - cd ./src
    - docker run -t --rm -v $(pwd):/app -w /app $DOCKER_IMAGE_NAME golangci-lint run -v -E gocritic --timeout "3m"
  rules:
  - changes:
    - src/**/*
    - .gitlab-ci.yml

compile:
  stage: build
  script:
    - cd ./src
    - mkdir -p release
    - go build -o release ./...
  rules:
  - changes:
    - src/**/*
    - .gitlab-ci.yml

docker-build:
  image: docker:cli
  stage: distribute
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - cd ./src
    - docker build --pull -t "$DOCKER_IMAGE_NAME" ../
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
  - changes:
    - src/**/*
    - .gitlab-ci.yml
    if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"

docker-build-private:
  image: docker:cli
  stage: distribute
  services:
    - docker:dind
  when: manual
  variables:
    CI_REGISTRY_IMAGE: $PRIVATE_REGISTRY/$CI_PROJECT_NAME
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$PRIVATE_REGISTRY_USER" -p "$PRIVATE_REGISTRY_PASSWORD" $PRIVATE_REGISTRY
  script:
    - cd ./src
    - docker build --pull -t "$DOCKER_IMAGE_NAME" ../
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
  - changes:
    - src/**/*
    - .gitlab-ci.yml
    if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"