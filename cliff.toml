# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to `proviant` are documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}\
    {% for commit in commits | filter(attribute="scope") | reverse | filter(attribute="scope") | reverse %}
    {% endfor %}\
    {% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
    {% endfor %}\
    {% for commit in commits | filter(attribute="scope") %}
    {% endfor %}\
    {% for commit in commits %}
        {% if commit.scope == "" and commit.breaking == false %}\
            - {{ commit.message | upper_first }}
        {% endif %}\
    {% endfor %}\
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace from the templates
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each commit with these parsers
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^add", group = "Added" },
    { message = "^implement", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^bug", group = "Fixed" },
    { message = "^hotfix", group = "Fixed" },
    { message = "^change", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^update", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^deprecat", group = "Deprecated" },
    { message = "^remove", group = "Removed" },
    { message = "^delete", group = "Removed" },
    { message = "^security", group = "Security" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^build", group = "Miscellaneous" },
    { message = "^style", group = "Miscellaneous" },
]
# filter out the commits that are not matched by any commit_parser
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v?[0-9].*"
# regex for parsing and grouping git tags
tag_parser = "v?[0-9].*"
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest to newest
sort_commits = "oldest"
